[package]
name = "learn-git-tui"
version = "0.1.0"
edition = "2024"
description = "Learn git by practicing real git inside a terminal UI"
repository = "https://github.com/matiasdante/learn-git-in-a-tui"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
include_dir = "0.7.4"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
toml = "1.2.0"
tui-textarea = "0.7.0"
