[[achievement]]
id = "first-repo"
title = { en = "Day one", es = "Día uno" }
description = { en = "Create your first repository.", es = "Creá tu primer repositorio." }
condition = { type = "exercise_done", exercise = "init-1" }

[[achievement]]
id = "first-commit"
title = { en = "First commit", es = "Primer commit" }
description = { en = "Save your first snapshot with git commit.", es = "Guardá tu primera foto con git commit." }
condition = { type = "exercise_done", exercise = "commit-1" }

[[achievement]]
id = "keeper-of-secrets"
title = { en = "Keeper of secrets", es = "Guardián de secretos" }
description = { en = "Make git forget a file committed by mistake.", es = "Hacé que git olvide un archivo commiteado por error." }
condition = { type = "exercise_done", exercise = "rm-2" }

[[achievement]]
id = "level-1-done"
title = { en = "Fundamentals complete", es = "Fundamentos completos" }
description = { en = "Finish every exercise of level 1.", es = "Terminá todos los ejercicios del nivel 1." }
condition = { type = "level_done", level = 1 }

[[achievement]]
id = "level-1-no-hints"
title = { en = "No training wheels", es = "Sin rueditas" }
description = { en = "Finish level 1 without using a single hint.", es = "Terminá el nivel 1 sin usar ni una pista." }
condition = { type = "level_no_hints", level = 1 }

[[achievement]]
id = "first-release"
title = { en = "Shipped it", es = "A producción" }
description = { en = "Mark a release with an annotated tag.", es = "Marcá una versión con un tag anotado." }
condition = { type = "exercise_done", exercise = "tag-1" }

[[achievement]]
id = "first-conflict"
title = { en = "Conflict resolved", es = "Conflicto resuelto" }
description = { en = "Resolve your first merge conflict.", es = "Resolvé tu primer conflicto de fusión." }
condition = { type = "exercise_done", exercise = "merge-conflict-1" }

[[achievement]]
id = "level-2-done"
title = { en = "Branch master", es = "Maestro de ramas" }
description = { en = "Finish every exercise of level 2.", es = "Terminá todos los ejercicios del nivel 2." }
condition = { type = "level_done", level = 2 }

[[achievement]]
id = "level-2-no-hints"
title = { en = "Branching blind", es = "Ramas a ciegas" }
description = { en = "Finish level 2 without using a single hint.", es = "Terminá el nivel 2 sin usar ni una pista." }
condition = { type = "level_no_hints", level = 2 }

[[achievement]]
id = "first-push"
title = { en = "Going public", es = "A la luz pública" }
description = { en = "Publish a branch to a remote for the first time.", es = "Publicá una rama en un remoto por primera vez." }
condition = { type = "exercise_done", exercise = "push-1" }

[[achievement]]
id = "team-player"
title = { en = "Team player", es = "Jugador de equipo" }
description = { en = "Integrate a teammate's commit and publish yours.", es = "Integrá el commit de un compañero y publicá el tuyo." }
condition = { type = "exercise_done", exercise = "pull-3" }

[[achievement]]
id = "level-3-done"
title = { en = "Remote control", es = "Control remoto" }
description = { en = "Finish every exercise of level 3.", es = "Terminá todos los ejercicios del nivel 3." }
condition = { type = "level_done", level = 3 }

[[achievement]]
id = "level-3-no-hints"
title = { en = "Lone wolf", es = "Lobo solitario" }
description = { en = "Finish level 3 without using a single hint.", es = "Terminá el nivel 3 sin usar ni una pista." }
condition = { type = "level_no_hints", level = 3 }

[[achievement]]
id = "reflog-rescue"
title = { en = "Reflog rescue", es = "Rescate con reflog" }
description = { en = "Recover commits you thought were lost.", es = "Recuperá commits que creías perdidos." }
condition = { type = "exercise_done", exercise = "reflog-1" }

[[achievement]]
id = "history-editor"
title = { en = "History editor", es = "Editor de historia" }
description = { en = "Squash commits with an interactive rebase.", es = "Aplastá commits con un rebase interactivo." }
condition = { type = "exercise_done", exercise = "rebase-2" }

[[achievement]]
id = "level-4-done"
title = { en = "Time traveler", es = "Viajero del tiempo" }
description = { en = "Finish every exercise of level 4.", es = "Terminá todos los ejercicios del nivel 4." }
condition = { type = "level_done", level = 4 }

[[achievement]]
id = "level-4-no-hints"
title = { en = "No second thoughts", es = "Sin arrepentimientos" }
description = { en = "Finish level 4 without using a single hint.", es = "Terminá el nivel 4 sin usar ni una pista." }
condition = { type = "level_no_hints", level = 4 }
