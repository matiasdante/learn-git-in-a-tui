id = "rebase"
level = 4
order = 4

[[exercise]]
id = "rebase-1"
hints = 2
solution = ["git rebase main"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "base.txt", content = "base\n" },
  { do = "git", args = "add base.txt" },
  { do = "git", args = "commit -m \"Add base\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "feature.txt", content = "f\n" },
  { do = "git", args = "add feature.txt" },
  { do = "git", args = "commit -m \"Add feature\"" },
  { do = "git", args = "switch main" },
  { do = "write", path = "main.txt", content = "m\n" },
  { do = "git", args = "add main.txt" },
  { do = "git", args = "commit -m \"Main work\"" },
  { do = "git", args = "switch feature" },
]
checks = [
  { type = "branch", name = "feature" },
  { type = "git_ok", args = "merge-base --is-ancestor main feature" },
  { type = "commit_count", count = 3 },
  { type = "git_output", args = "rev-list --merges --count HEAD", equals = "0" },
]

[[exercise]]
id = "rebase-2"
hints = 2
solution = [{ run = "git rebase -i HEAD~3", editor = [{ file = "git-rebase-todo", line_containing = "WIP part 2", from = "pick", to = "squash" }, { file = "git-rebase-todo", line_containing = "Finish feature", from = "pick", to = "squash" }] }]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"WIP part 1\"" },
  { do = "write", path = "c.txt", content = "c\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"WIP part 2\"" },
  { do = "write", path = "d.txt", content = "d\n" },
  { do = "git", args = "add d.txt" },
  { do = "git", args = "commit -m \"Finish feature\"" },
]
checks = [
  { type = "commit_count", count = 2 },
  { type = "file_exists", path = "d.txt" },
]

[[exercise]]
id = "rebase-3"
hints = 2
solution = [{ run = "git rebase -i HEAD~2", editor = [{ file = "git-rebase-todo", line_containing = "debug logging", from = "pick", to = "drop" }] }]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "debug.txt", content = "print stuff\n" },
  { do = "git", args = "add debug.txt" },
  { do = "git", args = "commit -m \"Add debug logging\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
]
checks = [
  { type = "file_missing", path = "debug.txt" },
  { type = "commit_count", count = 2 },
  { type = "file_exists", path = "b.txt" },
]
