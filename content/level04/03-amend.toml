id = "amend"
level = 4
order = 3

[[exercise]]
id = "amend-1"
hints = 2
solution = ["git commit --amend -m \"Add login page\""]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "login.txt", content = "x\n" },
  { do = "git", args = "add login.txt" },
  { do = "git", args = "commit -m \"Add logn page\"" },
]
checks = [
  { type = "git_output", args = "log -1 --format=%s", equals = "Add login page" },
  { type = "commit_count", count = 1 },
]

[[exercise]]
id = "amend-2"
hints = 1
solution = ["git commit --amend --no-edit"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
]
checks = [
  { type = "git_ok", args = "cat-file -e HEAD:b.txt" },
  { type = "commit_count", count = 1 },
]
