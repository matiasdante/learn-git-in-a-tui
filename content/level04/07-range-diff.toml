id = "range-diff"
level = 4
order = 7

[[exercise]]
id = "range-diff-1"
hints = 1
solution = ["git range-diff main v1 v2 > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "base.txt", content = "base\n" },
  { do = "git", args = "add base.txt" },
  { do = "git", args = "commit -m \"Add base\"" },
  { do = "git", args = "switch -c v1" },
  { do = "write", path = "x1.txt", content = "1\n" },
  { do = "git", args = "add x1.txt" },
  { do = "git", args = "commit -m \"Add x1\"" },
  { do = "write", path = "x2.txt", content = "2\n" },
  { do = "git", args = "add x2.txt" },
  { do = "git", args = "commit -m \"Add x2\"" },
  { do = "git", args = "switch -c v2" },
  { do = "git", args = "commit --amend -m \"Add x2 reworded\"" },
  { do = "git", args = "switch main" },
]
checks = [
  { type = "file_equals_git", path = "answer.txt", args = "range-diff main v1 v2" },
]
