id = "cherry-pick"
level = 4
order = 5

[[exercise]]
id = "cherry-pick-1"
hints = 2
solution = ["git cherry-pick feature"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "base.txt", content = "base\n" },
  { do = "git", args = "add base.txt" },
  { do = "git", args = "commit -m \"Add base\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
  { do = "write", path = "c.txt", content = "c\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"Fix c\"" },
  { do = "git", args = "switch main" },
]
checks = [
  { type = "branch", name = "main" },
  { type = "file_exists", path = "c.txt" },
  { type = "file_missing", path = "b.txt" },
  { type = "commit_count", count = 2 },
]
