id = "reflog"
level = 4
order = 8

[[exercise]]
id = "reflog-1"
hints = 2
solution = ["git reset --hard HEAD@{1}"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
  { do = "write", path = "c.txt", content = "c\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"Add c\"" },
  { do = "git", args = "reset --hard HEAD~2" },
]
checks = [
  { type = "commit_count", count = 3 },
  { type = "file_exists", path = "c.txt" },
]

[[exercise]]
id = "reflog-2"
hints = 2
solution = ["git branch feature HEAD@{1}"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "f.txt", content = "f\n" },
  { do = "git", args = "add f.txt" },
  { do = "git", args = "commit -m \"Add f\"" },
  { do = "git", args = "switch main" },
  { do = "git", args = "branch -D feature" },
]
checks = [
  { type = "branch_exists", name = "feature" },
  { type = "git_ok", args = "cat-file -e feature:f.txt" },
]
