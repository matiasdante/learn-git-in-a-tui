"exam.q1-init.text" = "Which command turns the current folder into a new git repository?"
"exam.q1-init.opt1" = "git start"
"exam.q1-init.opt2" = "git init"
"exam.q1-init.opt3" = "git new"
"exam.q1-init.opt4" = "git create"
"exam.q1-add.text" = "You edited a.txt and want it in the next commit. What do you run first?"
"exam.q1-add.opt1" = "git push a.txt"
"exam.q1-add.opt2" = "git log a.txt"
"exam.q1-add.opt3" = "git add a.txt"
"exam.q1-add.opt4" = "git save a.txt"
"exam.q2-switch.text" = "Which command creates a branch called fix and moves you to it?"
"exam.q2-switch.opt1" = "git switch -c fix"
"exam.q2-switch.opt2" = "git branch fix"
"exam.q2-switch.opt3" = "git merge fix"
"exam.q2-switch.opt4" = "git tag fix"
"exam.q2-conflict.text" = "Two branches changed the same line of a file. What happens when you merge them?"
"exam.q2-conflict.opt1" = "Git silently keeps the newest change"
"exam.q2-conflict.opt2" = "Git deletes one of the branches"
"exam.q2-conflict.opt3" = "Git keeps both lines without asking"
"exam.q2-conflict.opt4" = "Git reports a conflict that you must resolve"
"exam.q3-fetch.text" = "What does git fetch do?"
"exam.q3-fetch.opt1" = "Uploads your commits to the remote"
"exam.q3-fetch.opt2" = "Merges the remote branch into your current branch"
"exam.q3-fetch.opt3" = "Downloads new commits without changing your working branch"
"exam.q3-fetch.opt4" = "Deletes the remote branches"
"exam.q3-push.text" = "Which command uploads your local commits to the remote?"
"exam.q3-push.opt1" = "git pull"
"exam.q3-push.opt2" = "git push"
"exam.q3-push.opt3" = "git clone"
"exam.q3-push.opt4" = "git remote"
"exam.q4-revert.text" = "A bad commit is already pushed to a shared branch. What is the safe way to undo it?"
"exam.q4-revert.opt1" = "git revert <commit>, which adds a new commit that undoes it"
"exam.q4-revert.opt2" = "git reset --hard and force push"
"exam.q4-revert.opt3" = "Delete the repository and clone again"
"exam.q4-revert.opt4" = "git clean -f"
"exam.q4-reflog.text" = "After a git reset --hard you lost a commit. Which command helps you find it again?"
"exam.q4-reflog.opt1" = "git blame"
"exam.q4-reflog.opt2" = "git stash list"
"exam.q4-reflog.opt3" = "git cherry"
"exam.q4-reflog.opt4" = "git reflog"
"exam.q5-bisect.text" = "Which command finds the commit that introduced a bug using binary search?"
"exam.q5-bisect.opt1" = "git grep"
"exam.q5-bisect.opt2" = "git bisect"
"exam.q5-bisect.opt3" = "git shortlog"
"exam.q5-bisect.opt4" = "git describe"
"exam.q5-blame.text" = "Which command shows who last changed each line of a file?"
"exam.q5-blame.opt1" = "git show"
"exam.q5-blame.opt2" = "git log --stat"
"exam.q5-blame.opt3" = "git blame"
"exam.q5-blame.opt4" = "git diff"
