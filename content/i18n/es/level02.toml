"stash-2.check2.fail" = "El stash todavía tiene la entrada. Usá pop (o borrala)."
"stash-3.prompt" = "Creaste un archivo nuevo, new.txt, que git todavía no sigue. Guardalo también en el stash, para que desaparezca de la carpeta."
"stash-3.hint1" = "Un git stash común ignora los archivos sin seguimiento. Buscá la opción que los incluye."
