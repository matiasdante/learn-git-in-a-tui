"exam.q1-init.text" = "¿Qué comando convierte la carpeta actual en un repositorio git nuevo?"
"exam.q1-init.opt1" = "git start"
"exam.q1-init.opt2" = "git init"
"exam.q1-init.opt3" = "git new"
"exam.q1-init.opt4" = "git create"
"exam.q1-add.text" = "Editaste a.txt y querés que entre en el próximo commit. ¿Qué ejecutás primero?"
"exam.q1-add.opt1" = "git push a.txt"
"exam.q1-add.opt2" = "git log a.txt"
"exam.q1-add.opt3" = "git add a.txt"
"exam.q1-add.opt4" = "git save a.txt"
"exam.q2-switch.text" = "¿Qué comando crea una rama llamada fix y te mueve a ella?"
"exam.q2-switch.opt1" = "git switch -c fix"
"exam.q2-switch.opt2" = "git branch fix"
"exam.q2-switch.opt3" = "git merge fix"
"exam.q2-switch.opt4" = "git tag fix"
"exam.q2-conflict.text" = "Dos ramas cambiaron la misma línea de un archivo. ¿Qué pasa al fusionarlas?"
"exam.q2-conflict.opt1" = "Git se queda en silencio con el cambio más nuevo"
"exam.q2-conflict.opt2" = "Git borra una de las ramas"
"exam.q2-conflict.opt3" = "Git deja las dos líneas sin preguntar"
"exam.q2-conflict.opt4" = "Git informa un conflicto que tenés que resolver"
"exam.q3-fetch.text" = "¿Qué hace git fetch?"
"exam.q3-fetch.opt1" = "Sube tus commits al remoto"
"exam.q3-fetch.opt2" = "Fusiona la rama remota en tu rama actual"
"exam.q3-fetch.opt3" = "Descarga commits nuevos sin cambiar tu rama de trabajo"
"exam.q3-fetch.opt4" = "Borra las ramas remotas"
"exam.q3-push.text" = "¿Qué comando sube tus commits locales al remoto?"
"exam.q3-push.opt1" = "git pull"
"exam.q3-push.opt2" = "git push"
"exam.q3-push.opt3" = "git clone"
"exam.q3-push.opt4" = "git remote"
"exam.q4-revert.text" = "Un commit malo ya está publicado en una rama compartida. ¿Cuál es la forma segura de deshacerlo?"
"exam.q4-revert.opt1" = "git revert <commit>, que agrega un commit nuevo que lo deshace"
"exam.q4-revert.opt2" = "git reset --hard y push forzado"
"exam.q4-revert.opt3" = "Borrar el repositorio y clonar de nuevo"
"exam.q4-revert.opt4" = "git clean -f"
"exam.q4-reflog.text" = "Después de un git reset --hard perdiste un commit. ¿Qué comando te ayuda a encontrarlo?"
"exam.q4-reflog.opt1" = "git blame"
"exam.q4-reflog.opt2" = "git stash list"
"exam.q4-reflog.opt3" = "git cherry"
"exam.q4-reflog.opt4" = "git reflog"
