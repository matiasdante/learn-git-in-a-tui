"rerere-1.check2.fail" = "La fusión todavía no está commiteada."
"rerere-1.check3.fail" = "greeting.txt todavía tiene marcas de conflicto."
"rerere-1.check4.fail" = "git no grabó la resolución. ¿Activaste rerere antes de la fusión?"
