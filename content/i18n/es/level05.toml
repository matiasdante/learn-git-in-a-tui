"log-search.title" = "Buscar en la historia: log -S, -G y filtros"
"log-search.theory" = """
"¿Quién agregó esta clave de API?" `git log` puede buscar en el CONTENIDO de los cambios, no solo en los mensajes:

  git log -S"API_KEY"        pickaxe: commits que cambiaron cuántas veces aparece el texto
  git log -G"timeout=\\d+"    commits cuyo diff tiene una línea que coincide con la regex
  git log --author=Bob       commits de un autor
  git log --since=2.weeks    commits recientes
  git log --format=%h        solo el hash corto, uno por línea

Sumá --oneline o --stat a gusto, y -- <ruta> para limitar la búsqueda a un archivo."""
"log-search-1.prompt" = "Algún commit agregó el texto API_KEY a config.txt. Encontralo con la búsqueda pickaxe y escribí su hash corto en answer.txt."
"log-search-1.hint1" = "git log -S\"texto\" lista los commits que agregaron o quitaron ese texto."
"log-search-1.hint2" = "Agregá --format=%h para imprimir solo el hash y redirigí con > answer.txt."
"log-search-1.check1.fail" = "answer.txt debe contener el hash del commit que agregó API_KEY (\"Tweak config\")."
"log-search-2.prompt" = "¿Cuántos commits escribió Bob? Escribí el número en answer.txt."
"log-search-2.hint1" = "git log --author=Bob --oneline los lista; podés contar las líneas."
"log-search-2.hint2" = "git rev-list --count --author=Bob HEAD imprime el número directamente."
"log-search-2.check1.fail" = "answer.txt debe contener solo el número de commits de Bob."
"shortlog.title" = "Quién contribuye: shortlog"
"shortlog.theory" = """
`git shortlog` agrupa la historia por autor. Es la base de las notas de versión y de las listas de agradecimientos.

  git shortlog              títulos de commits agrupados por autor
  git shortlog -s           solo la cantidad de commits por autor
  git shortlog -sn          ordenado por cantidad, el mayor primero
  git shortlog -sne         con direcciones de e-mail"""
"shortlog-1.prompt" = "¿Qué autor tiene más commits? Escribí ese nombre en answer.txt."
"shortlog-1.hint1" = "git shortlog -sn ordena a los autores por cantidad de commits."
"shortlog-1.check1.fail" = "answer.txt debe contener el nombre de quien más contribuyó."
"blame.title" = "Línea por línea: blame"
"blame.theory" = """
Una línea rara en un archivo: ¿quién la escribió, cuándo y en qué commit? `git blame` anota cada línea con su último cambio.

  git blame app.txt          cada línea con commit, autor y fecha
  git blame -L 2,4 app.txt   solo las líneas 2 a 4
  git blame -w app.txt       ignora cambios que son solo de espacios

(`git annotate` hace lo mismo con un formato de salida apenas distinto.) El commit encontrado es el punto de partida: usá git show sobre él para leer el motivo."""
"blame-1.prompt" = "¿Quién escribió la línea 2 de app.txt? Escribí el nombre del autor en answer.txt."
"blame-1.hint1" = "git blame -L 2,2 app.txt anota solo la línea 2."
"blame-1.check1.fail" = "answer.txt debe contener el nombre de quien escribió la línea 2."
"grep.title" = "Buscar en el código: grep"
"grep.theory" = """
`git grep` busca solo en los archivos seguidos (sin resultados de build ni node_modules) y es rápido. También puede buscar en cualquier versión vieja.

  git grep TODO              líneas que contienen TODO
  git grep -n TODO           con números de línea
  git grep -c TODO           cantidad por archivo
  git grep -h TODO           sin los nombres de archivo
  git grep TODO v1.0         busca cómo estaba el código en v1.0"""
"grep-1.prompt" = "Guardá en todos.txt todas las líneas con TODO de los archivos seguidos (sin nombres de archivo)."
"grep-1.hint1" = "-h oculta los nombres de archivo."
"grep-1.hint2" = "Escribí: git grep -h TODO > todos.txt"
"grep-1.check1.fail" = "todos.txt debe contener exactamente la salida de git grep -h TODO."
"bisect.title" = "Encontrar al culpable: bisect"
"bisect.theory" = """
Hoy hay un bug, pero hace 8 commits funcionaba. En vez de probar cada commit, `git bisect` hace una búsqueda binaria: le decís un commit bueno y uno malo, te posiciona en el medio, decís bueno/malo y en unos log2(n) pasos nombra al primer commit malo.

  git bisect start
  git bisect bad                 el commit actual tiene el bug
  git bisect good <commit-viejo> este viejo andaba bien
  (git te deja en el medio: probalo y después git bisect good / git bisect bad)
  git bisect reset               volvé al terminar

Si tenés un script que sale con 0 si está bien y distinto de 0 si está mal, git lo hace todo: git bisect run ./test.sh"""
"bisect-1.prompt" = "status.txt decía \"ok\" en el primer commit y ahora dice \"broken\". El script ./test.sh sale con 0 cuando status.txt está ok. Usá bisect para encontrar el primer commit malo y escribí su hash en answer.txt."
"bisect-1.hint1" = "git bisect start <malo> <bueno> fija los dos extremos. Después git bisect run ./test.sh."
"bisect-1.hint2" = "Cuando termina, git rev-parse refs/bisect/bad es el culpable. Terminá con git bisect reset."
"bisect-1.check1.fail" = "answer.txt debe contener el hash del primer commit donde status.txt quedó broken (\"Change 5\")."
"show-branch.title" = "Comparar ramas: show-branch"
"show-branch.theory" = """
`git show-branch` dibuja una tabla compacta: una columna por rama y una fila por commit, así ves de un vistazo cómo divergieron las ramas y dónde comparten historia.

  git show-branch main feature
  git show-branch --all           todas las ramas

Los commits marcados con * están en la rama actual, + en las otras; las últimas filas son los ancestros compartidos."""
"show-branch-1.prompt" = "Comparé main y feature con git show-branch y escribí en answer.txt cuántos commits tiene feature que main no tiene."
"show-branch-1.hint1" = "Ejecutá git show-branch main feature y contá las filas marcadas solo para feature."
"show-branch-1.check1.fail" = "Primero usá git show-branch para comparar las ramas."
"show-branch-1.check2.fail" = "answer.txt debe contener el número 2."
"name-rev.title" = "Nombres humanos para hashes: name-rev"
"name-rev.theory" = """
Dado un hash de un log o de un reporte de error, `git name-rev` te dice dónde está en relación con una rama o un tag.

  git name-rev <hash>              p. ej. 3f9a1c2 main~3
  git name-rev --name-only <hash>  solo el nombre
  git name-rev --tags <hash>       relativo a los tags"""
"name-rev-1.prompt" = "Guardá en answer.txt el nombre que git name-rev le da (solo el nombre) al commit HEAD~2."
"name-rev-1.hint1" = "Usá --name-only y redirigí con > answer.txt."
"name-rev-1.check1.fail" = "answer.txt debe contener exactamente la salida de git name-rev --name-only HEAD~2."
"merge-base.title" = "Encontrar el punto de bifurcación: merge-base"
"merge-base.theory" = """
¿Dónde se separó `feature` de `main`? `git merge-base A B` imprime el mejor ancestro común de dos commits: el punto que comparten las dos historias. Merge y rebase lo usan internamente.

  git merge-base main feature
  git merge-base --is-ancestor A B    código de salida 0 si A está contenido en B"""
"merge-base-1.prompt" = "Escribí en answer.txt el hash del commit donde feature se separó de main."
"merge-base-1.hint1" = "git merge-base recibe las dos ramas."
"merge-base-1.check1.fail" = "answer.txt debe contener el hash del punto de bifurcación (\"Two\")."
"difftool.title" = "Ver cambios con una herramienta: difftool"
"difftool.theory" = """
`git difftool` ejecuta una herramienta de diff a elección en vez del diff integrado. Los equipos usan visores gráficos; acá está configurado para imprimir un diff unificado en la consola. Recibe los mismos argumentos que git diff:

  git difftool                 árbol de trabajo vs área de preparación
  git difftool HEAD~1 HEAD     dos commits
  git difftool --staged

(El programa que git lanza para cada par de archivos es `git difftool--helper`, un comando interno que nunca llamás vos.)"""
"difftool-1.prompt" = "notes.txt tiene cambios sin commitear. Miralos con git difftool y guardá su salida en diff.txt."
"difftool-1.hint1" = "difftool funciona como git diff; redirigí su salida con > diff.txt."
"difftool-1.check1.fail" = "diff.txt debe contener el diff de notes.txt (con la línea agregada)."
"difftool-helper.title" = "difftool--helper (interno)"
"difftool-helper.theory" = """
`git difftool--helper` no es un comando para vos. Cuando ejecutás `git difftool`, git llama a este ayudante una vez por cada archivo cambiado; el ayudante lee la herramienta configurada (diff.tool, difftool.<herramienta>.cmd), prepara las copias LOCAL y REMOTE del archivo y lanza tu herramienta.

Solo lo vas a ver en listas de procesos o al depurar una configuración rota de difftool. Si un difftool no hace nada, revisá git config diff.tool y difftool.<herramienta>.cmd en vez de llamar al ayudante directamente."""
