"cat-file.title" = "Lendo objetos: cat-file"
"cat-file.theory" = """
Tudo o que o git guarda é um objeto identificado pelo seu hash: blob (conteúdo de arquivo), tree (pasta), commit e tag. O `git cat-file` lê qualquer um deles.

  git cat-file -t HEAD            o tipo do objeto (commit)
  git cat-file -p HEAD            mostra o objeto de forma legível
  git cat-file -p HEAD:a.txt      o conteúdo de um arquivo em um commit
  git cat-file -s HEAD:a.txt      o tamanho em bytes"""
"cat-file-1.prompt" = "Salve em answer.txt o conteúdo do a.txt como era dois commits atrás (HEAD~2), lendo-o direto do banco de objetos."
"cat-file-1.hint1" = "O cat-file -p recebe revisão:caminho."
"cat-file-1.check1.fail" = "answer.txt deve conter exatamente a saída de git cat-file -p HEAD~2:a.txt."
"hash-object.title" = "Criando blobs: hash-object"
"hash-object.theory" = """
O hash de um arquivo é calculado só a partir do conteúdo dele (mais um pequeno cabeçalho). O `git hash-object` o mostra e, com -w, também GRAVA o objeto no repositório.

  git hash-object hello.txt        só calcula o hash
  git hash-object -w hello.txt     calcula e guarda o blob
  git hash-object --stdin          calcula o hash do texto lido da entrada"""
"hash-object-1.prompt" = "Guarde o hello.txt como um blob no banco de objetos (sem prepará-lo) e salve o hash dele em answer.txt."
"hash-object-1.hint1" = "O -w grava o objeto."
"hash-object-1.hint2" = "Digite: git hash-object -w hello.txt > answer.txt"
"hash-object-1.check1.fail" = "O blob não está no banco de objetos. Você usou -w?"
"hash-object-1.check2.fail" = "O answer.txt deve conter o hash do blob."
"ls-tree.title" = "Listando uma tree: ls-tree"
"ls-tree.theory" = """
Um objeto tree é uma pasta: uma lista de nomes, modos e hashes. O `git ls-tree` a imprime.

  git ls-tree HEAD                  modo, tipo, hash e nome de cada entrada
  git ls-tree --name-only HEAD      só os nomes
  git ls-tree -r HEAD               recursivo, entrando nas subpastas"""
"ls-tree-1.prompt" = "Salve em answer.txt os nomes dos arquivos da tree do HEAD~1."
"ls-tree-1.hint1" = "Use --name-only e indique o commit."
"ls-tree-1.check1.fail" = "answer.txt deve conter exatamente a saída de git ls-tree --name-only HEAD~1."
"ls-files.title" = "O índice: ls-files"
"ls-files.theory" = """
O índice (área de preparação) é uma lista de caminhos com o blob que cada um terá no próximo commit. O `git ls-files` o mostra.

  git ls-files               caminhos rastreados
  git ls-files --stage       modo, hash, número de estágio e caminho
  git ls-files --others      arquivos sem rastreamento
  git ls-files --deleted     arquivos rastreados que faltam no disco"""
"ls-files-1.prompt" = "Salve em answer.txt o conteúdo completo do índice (modo, hash e caminho de cada arquivo)."
"ls-files-1.hint1" = "O --stage acrescenta o modo e o hash."
"ls-files-1.check1.fail" = "answer.txt deve conter exatamente a saída de git ls-files --stage."
"mktree.title" = "Montando uma tree à mão: mktree"
"mktree.theory" = """
O `git mktree` lê da entrada padrão linhas no formato `<modo> <tipo> <hash><TAB><nome>` e cria o objeto tree. É assim que você montaria uma pasta sem tocar em nenhum arquivo de trabalho.

  git hash-object -w hello.txt            -> o hash do blob
  git mktree                              depois digite:  100644 blob <hash><TAB>hello.txt   e aperte Ctrl+D

Ele imprime o hash da nova tree."""
"mktree-1.prompt" = "Crie com o git mktree uma tree que contenha o arquivo hello.txt (blob 3b18e512dba79e4c8300dd08aeb37f8e728b8dad, modo 100644) e salve o hash da tree em answer.txt. Guarde o blob antes."
"mktree-1.hint1" = "Execute primeiro git hash-object -w hello.txt e depois git mktree > answer.txt."
"mktree-1.hint2" = "Digite a linha com um TAB de verdade entre o hash e o nome; termine com Ctrl+D."
"mktree-1.check1.fail" = "O answer.txt deve conter o hash de uma tree que tenha o hello.txt."
"write-tree.title" = "Do índice para uma tree: write-tree"
"write-tree.theory" = "O `git write-tree` transforma o índice atual em um objeto tree e imprime o hash dele. É a primeira metade do que o `git commit` faz (a segunda, o commit-tree, envolve essa tree em um commit)."
"write-tree-1.prompt" = "O a.txt e o b.txt estão preparados. Escreva o índice como um objeto tree e salve o hash dele em answer.txt."
"write-tree-1.hint1" = "Digite: git write-tree > answer.txt"
"write-tree-1.check1.fail" = "O answer.txt deve conter o hash da tree com a.txt e b.txt."
"read-tree.title" = "De uma tree para o índice: read-tree"
"read-tree.theory" = """
O `git read-tree <tree-ish>` é o oposto do write-tree: carrega uma tree no índice, substituindo-o. Os arquivos da pasta de trabalho não são tocados. Os comandos de alto nível reset e checkout o usam por dentro.

  git read-tree HEAD~1        o índice agora se parece com o commit anterior"""
"read-tree-1.prompt" = "Faça o índice ficar parecido com o commit anterior (HEAD~1), sem mexer nos arquivos do disco."
"read-tree-1.hint1" = "Digite: git read-tree HEAD~1"
"read-tree-1.check1.fail" = "O índice deveria conter só o a.txt."
"read-tree-1.check2.fail" = "O b.txt deve permanecer no disco."
"commit-tree.title" = "Criando um commit à mão: commit-tree"
"commit-tree.theory" = "O `git commit-tree <tree> -m \"mensagem\"` cria um objeto commit para uma tree, opcionalmente com pais (-p <commit>), e imprime o hash dele. Ele NÃO move nenhum branch: o commit existe, mas nada aponta para ele até você atualizar uma ref.\n\n  git commit-tree <tree> -m \"Commit manual\"\n  git commit-tree <tree> -p HEAD -m \"Filho do HEAD\""
"commit-tree-1.prompt" = "O a.txt está preparado. Crie um objeto commit a partir da tree do índice com a mensagem \"Manual commit\" e salve o hash dele em answer.txt. Nenhum branch pode se mover."
"commit-tree-1.hint1" = "Primeiro git write-tree, depois git commit-tree <esse hash> -m \"Manual commit\"."
"commit-tree-1.check1.fail" = "O answer.txt deve conter o hash de um commit com a mensagem \"Manual commit\"."
"commit-tree-1.check2.fail" = "Um branch se moveu: o commit-tree não deve atualizar nenhum branch."
"update-ref.title" = "Movendo referências: update-ref"
"update-ref.theory" = """
Branches e tags são só arquivos que contêm um hash (em .git/refs/). O `git update-ref` os cria e move com segurança.

  git update-ref refs/heads/manual HEAD      cria o branch manual no HEAD
  git update-ref refs/heads/manual <commit>  move o branch
  git update-ref -d refs/heads/manual        apaga o branch"""
"update-ref-1.prompt" = "Crie um branch chamado manual que aponte para o commit anterior (HEAD~1), usando update-ref e não git branch."
"update-ref-1.hint1" = "O nome completo de um branch é refs/heads/<nome>."
"update-ref-1.check1.fail" = "O branch manual não aponta para o HEAD~1."
"update-ref-1.check2.fail" = "Use o git update-ref."
"symbolic-ref.title" = "Para onde o HEAD aponta: symbolic-ref"
"symbolic-ref.theory" = """
O HEAD normalmente não é um hash, e sim uma referência simbólica: o nome do branch atual. O `git symbolic-ref` a lê e a escreve.

  git symbolic-ref HEAD                         refs/heads/main
  git symbolic-ref --short HEAD                 main
  git symbolic-ref HEAD refs/heads/other        troca o branch atual SEM mexer nos arquivos (cuidado!)"""
"symbolic-ref-1.prompt" = "Faça o HEAD apontar para o branch other editando diretamente a referência simbólica."
"symbolic-ref-1.hint1" = "O symbolic-ref recebe o nome (HEAD) e depois a ref de destino."
"symbolic-ref-1.check1.fail" = "O HEAD ainda não aponta para refs/heads/other."
"rev-parse.title" = "Traduzindo nomes: rev-parse"
"rev-parse.theory" = """
O `git rev-parse` é o canivete suíço dos scripts: transforma qualquer expressão de revisão em um hash completo e responde perguntas sobre o repositório.

  git rev-parse HEAD~2              hash completo
  git rev-parse --short HEAD        hash curto
  git rev-parse --abbrev-ref HEAD   nome do branch atual
  git rev-parse --show-toplevel     pasta raiz da árvore de trabalho
  git rev-parse --is-inside-work-tree"""
"rev-parse-1.prompt" = "Salve o hash completo do HEAD~2 em answer.txt."
"rev-parse-1.hint1" = "Digite: git rev-parse HEAD~2 > answer.txt"
"rev-parse-1.check1.fail" = "answer.txt deve conter exatamente a saída de git rev-parse HEAD~2."
"rev-list.title" = "Percorrendo o histórico: rev-list"
"rev-list.theory" = """
O `git rev-list` imprime os hashes dos commits alcançáveis a partir de um ponto de partida, um por linha. É o motor por baixo do `git log` e ideal para scripts.

  git rev-list HEAD                  todos os commits
  git rev-list --count main..feature quantos commits o feature tem que o main não tem
  git rev-list --max-count=3 HEAD    só três
  git rev-list --merges HEAD         só commits de merge"""
"rev-list-1.prompt" = "Salve em answer.txt quantos commits o feature tem que o main não tem."
"rev-list-1.hint1" = "Use --count com main..feature."
"rev-list-1.check1.fail" = "answer.txt deve conter exatamente a saída de git rev-list --count main..feature."
"for-each-ref.title" = "Listando refs com formato: for-each-ref"
"for-each-ref.theory" = """
O `git for-each-ref` lista branches, tags e outras refs com o formato que você escolher. Saída pensada para scripts: estável e sem decoração.

  git for-each-ref refs/heads
  git for-each-ref --format='%(refname:short)' refs/heads     só os nomes dos branches
  git for-each-ref --sort=-committerdate refs/heads           primeiro o usado mais recentemente"""
"for-each-ref-1.prompt" = "Salve em answer.txt os nomes curtos de todos os branches locais (um por linha, nada mais)."
"for-each-ref-1.hint1" = "Use --format=%(refname:short) e o prefixo refs/heads."
"for-each-ref-1.check1.fail" = "answer.txt deve conter exatamente a saída de git for-each-ref --format=%(refname:short) refs/heads."
"show-ref.title" = "Branches e tags com hashes: show-ref"
"show-ref.theory" = """
O `git show-ref` imprime `hash nome-da-ref` para cada ref. Também serve para testar se uma ref existe:

  git show-ref --heads               branches
  git show-ref --tags                tags
  git show-ref --verify refs/heads/main   código de saída 0 se existe"""
"show-ref-1.prompt" = "Salve a lista de tags com seus hashes em answer.txt."
"show-ref-1.hint1" = "O show-ref tem uma opção --tags."
"show-ref-1.check1.fail" = "answer.txt deve conter exatamente a saída de git show-ref --tags."
"check-ref-format.title" = "Nomes válidos: check-ref-format"
"check-ref-format.theory" = """
Nem toda string pode ser nome de branch ou de tag: sem espaços, sem `..`, sem `~ ^ : ? * [ \\`, não pode terminar em `.lock` nem em `/`. O `git check-ref-format` testa um nome; o código de saída 0 significa válido.

  git check-ref-format refs/heads/feature/login     válido (saída 0)
  git check-ref-format refs/heads/feature..login    inválido (saída 1)
  git check-ref-format --branch feature/login       valida o nome de um branch"""
"check-ref-format-1.prompt" = "feature..login é um nome de branch válido? Teste com git check-ref-format (o código de saída diz) e escreva yes ou no em answer.txt."
"check-ref-format-1.hint1" = "Use o nome completo refs/heads/feature..login. Uma falha aparece como [exit code 1]."
"check-ref-format-1.check1.fail" = "Teste o nome com git check-ref-format."
"check-ref-format-1.check2.fail" = "O nome não é válido (.. é proibido): o answer.txt deveria dizer no."
"diff-files.title" = "Árvore de trabalho vs índice: diff-files"
"diff-files.theory" = """
Os três comandos de plumbing de diff comparam pares diferentes:

  git diff-files        árvore de trabalho  vs  índice       (mudanças não preparadas)
  git diff-index HEAD   índice/tree         vs  um commit    (tudo desde o HEAD)
  git diff-tree A B     tree                vs  tree         (dois commits)

A saída crua deles é estável para scripts. Acrescente --name-only para listar só os caminhos."""
"diff-files-1.prompt" = "Salve em answer.txt os nomes dos arquivos modificados na árvore de trabalho e ainda não preparados."
"diff-files-1.hint1" = "O diff-files compara a árvore de trabalho com o índice."
"diff-files-1.check1.fail" = "answer.txt deve conter exatamente a saída de git diff-files --name-only."
"diff-index.title" = "Contra um commit: diff-index"
"diff-index.theory" = """
O `git diff-index <commit>` compara um commit com o índice e com a árvore de trabalho. Com --cached compara só o commit com o índice (o que você está prestes a commitar).

  git diff-index --name-only HEAD          todo arquivo que difere do HEAD
  git diff-index --cached --name-only HEAD só os preparados"""
"diff-index-1.prompt" = "Salve em answer.txt só os nomes dos arquivos que estão PREPARADOS (diferem entre o HEAD e o índice)."
"diff-index-1.hint1" = "Acrescente --cached para comparar só o índice."
"diff-index-1.check1.fail" = "answer.txt deve conter exatamente a saída de git diff-index --cached --name-only HEAD."
"diff-tree.title" = "Entre duas trees: diff-tree"
"diff-tree.theory" = """
O `git diff-tree` compara duas trees (normalmente dois commits) sem tocar na pasta de trabalho. Para um só commit, ele o compara com o pai.

  git diff-tree --no-commit-id --name-only -r HEAD     arquivos que o último commit mudou
  git diff-tree -r A B                                  arquivos que diferem entre A e B"""
"diff-tree-1.prompt" = "Salve em answer.txt os nomes dos arquivos alterados pelo último commit."
"diff-tree-1.hint1" = "Combine --no-commit-id, --name-only e -r."
"diff-tree-1.check1.fail" = "answer.txt deve conter exatamente a saída de git diff-tree --no-commit-id --name-only -r HEAD."
"checkout-index.title" = "Do índice para o disco: checkout-index"
"checkout-index.theory" = """
O `git checkout-index` copia arquivos do índice para a pasta de trabalho. É assim que você restaura um arquivo apagado para a versão preparada.

  git checkout-index a.txt        restaura um arquivo
  git checkout-index -a           restaura tudo o que falta
  git checkout-index -a -f        sobrescreve também os arquivos que existem"""
"checkout-index-1.prompt" = "O a.txt foi apagado da pasta, mas ainda está no índice. Traga-o de volta a partir do índice."
"checkout-index-1.hint1" = "Digite: git checkout-index a.txt"
"checkout-index-1.check1.fail" = "O a.txt ainda não voltou."
"merge-file.title" = "Mesclando três arquivos: merge-file"
"merge-file.theory" = """
O `git merge-file` faz um merge de três vias de arquivos comuns, sem nenhum repositório envolvido: sua versão, a base comum e a outra versão. O resultado é gravado sobre a sua versão.

  git merge-file mine.txt base.txt theirs.txt

Se os dois mudaram as mesmas linhas, são inseridas marcas de conflito e o código de saída é a quantidade de conflitos."""
"merge-file-1.prompt" = "Faça o merge do theirs.txt no mine.txt usando o base.txt como ancestral comum. As duas mudanças (em linhas diferentes) devem ficar no mine.txt."
"merge-file-1.hint1" = "A ordem é: seu arquivo, a base, o outro arquivo."
"merge-file-1.check1.fail" = "O mine.txt deveria ter as duas mudanças: \"1 mine\" e \"3 theirs\"."
"merge-tree.title" = "Mesclando sem tocar em nada: merge-tree"
"merge-tree.theory" = """
O `git merge-tree --write-tree A B` (git 2.38+) faz o merge de dois commits inteiramente em memória e imprime o hash da tree resultante, sem mudar o índice nem a pasta de trabalho. Um servidor pode usá-lo para saber se um branch faz merge limpo.

  git merge-tree --write-tree main feature     imprime a tree (e, se houver conflitos, os lista e sai com 1)"""
"merge-tree-1.prompt" = "Calcule, sem fazer o merge de verdade, a tree que o merge do feature no main produziria e salve o hash dela em answer.txt."
"merge-tree-1.hint1" = "Use --write-tree com os dois branches e redirecione para answer.txt."
"merge-tree-1.check1.fail" = "O answer.txt deve conter o hash da tree mesclada (arquivos de base, feature e main)."
"merge-tree-1.check2.fail" = "Nenhum merge de verdade deveria ter acontecido."
"unpack-file.title" = "Um blob como arquivo temporário: unpack-file"
"unpack-file.theory" = """
O `git unpack-file <blob>` grava o conteúdo de um blob em um arquivo temporário novo na pasta atual (chamado .merge_file_XXXX) e imprime o nome dele. As ferramentas de merge o usam para te entregar as três versões de um arquivo em conflito.

  git unpack-file $(git rev-parse HEAD:a.txt)"""
"unpack-file-1.prompt" = "Extraia o blob do a.txt no HEAD para um arquivo temporário e salve em answer.txt o nome do arquivo que o git imprime."
"unpack-file-1.hint1" = "Pegue o hash do blob com git rev-parse HEAD:a.txt e passe-o ao unpack-file."
"unpack-file-1.check1.fail" = "O answer.txt deve conter o nome do arquivo temporário (.merge_file_...)."
"var.title" = "As variáveis do próprio git: var"
"var.theory" = """
O `git var` imprime valores que o git calcula: quem ele acha que você é, qual editor ele abriria.

  git var GIT_AUTHOR_IDENT       Nome <email> marca-de-tempo fuso
  git var GIT_COMMITTER_IDENT
  git var GIT_EDITOR
  git var -l                     tudo"""
"var-1.prompt" = "Salve em answer.txt a identidade que o git usaria como autor do seu próximo commit."
"var-1.hint1" = "A variável é GIT_AUTHOR_IDENT."
"var-1.check1.fail" = "answer.txt deve conter exatamente a saída de git var GIT_AUTHOR_IDENT."
"mktag.title" = "Criando um objeto tag: mktag"
"mktag.theory" = """
Uma tag anotada é um objeto próprio. O `git mktag` monta uma a partir de um texto com formato estrito lido da entrada padrão:

  object <hash do commit>
  type commit
  tag v1
  tagger Ann <ann@example.com> 1704110400 +0000
  <linha em branco>
  mensagem

Ele imprime o hash do objeto tag; para publicá-lo você ainda precisa apontar uma ref para ele (git update-ref refs/tags/v1 <hash>)."""
"mktag-1.prompt" = "Crie com o git mktag um objeto tag chamado v1 para o último commit (tagger Ann <ann@example.com> 1704110400 +0000, mensagem \"First version\") e salve o hash dele em answer.txt."
"mktag-1.hint1" = "Pegue o hash do commit com git rev-parse HEAD. Digite as linhas do formato, uma linha em branco, a mensagem e depois Ctrl+D."
"mktag-1.check1.fail" = "O answer.txt deve conter o hash de um objeto tag."
"mktag-1.check2.fail" = "O objeto tag deve se chamar v1."
"update-index.title" = "Editando o índice: update-index"
"update-index.theory" = """
O `git update-index` modifica o índice diretamente. O `git add` e o `git rm --cached` são versões mais amigáveis dele.

  git update-index --add a.txt           coloca um arquivo novo no índice
  git update-index --chmod=+x run.sh     torna um arquivo executável no índice
  git update-index --assume-unchanged f  finge que um arquivo nunca muda (cuidado)"""
"update-index-1.prompt" = "Coloque o run.sh no índice como arquivo executável (modo 100755) usando update-index, não git add."
"update-index-1.hint1" = "Você precisa de --add (arquivo novo) e --chmod=+x."
"update-index-1.check1.fail" = "O run.sh não está no índice com o modo 100755."
"update-index-1.check2.fail" = "O a.txt deveria continuar sem rastreamento."
"checkout-worker.title" = "checkout--worker (interno)"
"checkout-worker.theory" = """
O `git checkout--worker` é um processo auxiliar do checkout paralelo. Quando o git grava muitos arquivos de uma vez (um checkout ou clone grande), ele pode iniciar vários workers que gravam, cada um, uma parte dos arquivos, o que é bem mais rápido em discos velozes.

O recurso é controlado com checkout.workers (0 = todos os núcleos, 1 = sem paralelismo). Você nunca executa o ajudante."""
"merge-index.title" = "merge-index"
"merge-index.theory" = """
O `git merge-index` executa um programa para cada arquivo que ainda não foi mesclado no índice. É a cola entre a engrenagem de merge e os pequenos programas que resolvem cada arquivo; hoje é usado pelas estratégias de merge antigas.

  git merge-index git-merge-one-file -a

Na prática você resolve conflitos editando arquivos e com git add, não com este comando."""
"merge-one-file.title" = "merge-one-file"
"merge-one-file.theory" = """
O `git merge-one-file` é o programa padrão que o `git merge-index` chama para cada arquivo não mesclado. Ele decide o que fazer: pegar o arquivo se só um lado o adicionou, apagá-lo se um lado o apagou e o outro não o mudou, ou fazer um merge de três vias do conteúdo (deixando marcas de conflito quando necessário).

Faz parte da plumbing das estratégias `resolve` e `octopus`."""
"sh-i18n-envsubst.title" = "sh-i18n--envsubst (interno)"
"sh-i18n-envsubst.theory" = """
O `git sh-i18n--envsubst` é um programinha interno que substitui `$variáveis` em uma mensagem traduzida. Os scripts de shell do git (git-sh-i18n) o usam para imprimir mensagens no seu idioma com os valores certos inseridos.

Você nunca vai precisar dele, a menos que esteja traduzindo o próprio git."""
"merge-ours.title" = "Estratégia: ours"
"merge-ours.theory" = """
O `ours` registra um merge, mas mantém EXATAMENTE o seu lado, ignorando todas as mudanças dos outros branches. Serve para marcar um branch como mesclado quando você não quer o conteúdo dele.

  git merge -s ours branch-antigo

Não confunda com a opção -X ours, que faz o merge normalmente e só prefere o seu lado onde há conflitos."""
"merge-recursive.title" = "Estratégia: recursive (e ort)"
"merge-recursive.theory" = """
A `recursive` foi a estratégia padrão para fazer merge de dois branches: encontra o ancestral comum e, quando há vários, os mescla recursivamente para montar um virtual. Desde o git 2.34 o padrão é a reescrita mais rápida `ort`, com os mesmos resultados em quase todos os casos.

  git merge -s recursive feature
  git merge -s ort feature

Você raramente escolhe uma estratégia à mão; as opções -X ours / -X theirs são mais comuns."""
"merge-recursive-ours.title" = "recursive com -X ours"
"merge-recursive-ours.theory" = """
O `merge-recursive-ours` é a variante da estratégia recursive que resolve automaticamente a favor do SEU lado os trechos em conflito; as mudanças sem conflito do outro branch continuam sendo mescladas.

  git merge -X ours feature

O merge termina sem perguntar nada, então confira o resultado: você pode estar descartando em silêncio o trabalho do outro branch."""
"merge-recursive-theirs.title" = "recursive com -X theirs"
"merge-recursive-theirs.theory" = """
O `merge-recursive-theirs` é a imagem espelhada: os trechos em conflito são resolvidos a favor do OUTRO branch.

  git merge -X theirs feature

Útil quando você sabe que o branch que chega está certo (por exemplo, um arquivo gerado), mas nunca substitui a leitura dos conflitos quando o código importa."""
"merge-resolve.title" = "Estratégia: resolve"
"merge-resolve.theory" = """
A `resolve` é a estratégia antiga de duas pontas: um merge de três vias simples que usa só um ancestral comum e não detecta renomeações. É mais simples e, em casos raros de merges cruzados, mais conservadora.

  git merge -s resolve feature

Ela continua existindo por compatibilidade; hoje o ort cobre os casos de uso dela."""
"merge-octopus.title" = "Estratégia: octopus"
"merge-octopus.theory" = """
A `octopus` mescla MAIS de dois branches em um único commit com muitos pais. É a padrão quando você passa vários branches ao git merge, e se recusa a começar se houver um conflito para resolver à mão.

  git merge feature-a feature-b feature-c

Boa para juntar branches temáticos independentes que não mexem nas mesmas linhas."""
