"rebase-3.check3.fail" = "O b.txt deve permanecer."
"cherry-pick.title" = "Levando um commit: cherry-pick"
"cherry-pick.theory" = """
Uma correção mora em um branch cheio de trabalho inacabado. Você só quer essa correção no main. `git cherry-pick` copia um commit para o branch atual como um commit novo.

  git cherry-pick <commit>      copia o commit
  git cherry-pick feature       copia o último commit de um branch
  git cherry-pick A B           copia vários"""
"cherry-pick-1.prompt" = "O feature tem dois commits: \"Add b\" (inacabado) e \"Fix c\". Traga só o último (Fix c) para o main."
"cherry-pick-1.hint1" = "Indicar o branch escolhe o último commit dele."
"cherry-pick-1.hint2" = "Digite: git cherry-pick feature"
"cherry-pick-1.check1.fail" = "Você deveria estar no main."
"cherry-pick-1.check2.fail" = "A correção (c.txt) ainda não está no main."
"cherry-pick-1.check3.fail" = "O b.txt veio junto: só o último commit deve ser copiado."
"cherry-pick-1.check4.fail" = "O main deveria ter 2 commits: a base e a correção copiada."
"cherry.title" = "O que ainda falta: cherry"
"cherry.theory" = """
Depois de um cherry-pick, como saber quais commits de um branch já estão em outro? `git cherry <upstream> <branch>` compara pelo conteúdo do patch, não pelo hash:

  + commit que ainda falta no upstream
  - commit que o upstream já tem (um patch equivalente)

  git cherry main feature
  git cherry -v main feature     mostra também os títulos"""
"cherry-1.prompt" = "A correção do feature foi copiada para o main com cherry-pick, mas o \"Add b\" não. Salve a saída de git cherry main feature em answer.txt."
"cherry-1.hint1" = "Redirecione a saída com > answer.txt."
"cherry-1.check1.fail" = "O answer.txt deve conter exatamente a saída de git cherry main feature."
"range-diff.title" = "Comparando versões de um branch: range-diff"
"range-diff.theory" = """
Você fez rebase ou amend em um branch e quem revisa pergunta "o que mudou desde a versão anterior?". Comparar as árvores finais gera muito ruído. `git range-diff` emparelha os commits da versão antiga com os da nova e mostra só o que mudou em cada par.

  git range-diff main v1 v2

`=` o commit é o mesmo, `!` mudou, `<` só existe na versão antiga, `>` só na nova."""
"range-diff-1.prompt" = "O v2 é uma versão retrabalhada do branch v1 (os dois partem do main). Salve a saída de git range-diff main v1 v2 em answer.txt."
"range-diff-1.hint1" = "O range-diff recebe a base e os dois branches."
"range-diff-1.check1.fail" = "O answer.txt deve conter exatamente a saída de git range-diff main v1 v2."
"reflog.title" = "A rede de segurança: reflog"
"reflog.theory" = """
Você executou `git reset --hard` e seus commits sumiram do `git log`. Eles não se foram: o git guarda por semanas um diário privado de onde o HEAD (e cada branch) apontou, o reflog.

  git reflog                    lista por onde o HEAD passou, o mais novo primeiro
  HEAD@{1}                      onde o HEAD estava um movimento atrás
  git reset --hard HEAD@{1}     volta a esse estado
  git branch resgatado HEAD@{3} cria um branch a partir de uma posição antiga

Se você não encontra algo no git log, olhe no git reflog antes de entrar em pânico."""
"reflog-1.prompt" = "Você executou git reset --hard HEAD~2 por engano e perdeu \"Add b\" e \"Add c\". Recupere-os."
"reflog-1.hint1" = "O git reflog mostra onde o HEAD estava antes do reset."
"reflog-1.hint2" = "Digite: git reset --hard HEAD@{1}"
"reflog-1.check1.fail" = "Os 3 commits ainda não voltaram."
"reflog-1.check2.fail" = "O c.txt ainda está faltando."
"reflog-2.prompt" = "Você apagou o branch feature com -D antes de fazer o merge. Recrie-o com o commit \"Add f\"."
"reflog-2.hint1" = "O commit ainda está no reflog, um movimento atrás."
"reflog-2.hint2" = "Digite: git branch feature HEAD@{1}"
"reflog-2.check1.fail" = "O branch feature ainda não existe."
"reflog-2.check2.fail" = "O feature não tem o commit \"Add f\"."
"rerere.title" = "Lembrando resoluções: rerere"
"rerere.theory" = """
Se você faz rebase do mesmo branch muitas vezes, resolve o mesmo conflito de novo e de novo. O `rerere` ("reuse recorded resolution") grava como você resolveu um conflito e aplica a mesma resolução automaticamente da próxima vez.

  git config rerere.enabled true    liga o recurso
  (resolva um conflito como de costume)   o git grava o antes/depois em .git/rr-cache
  próximo conflito idêntico         resolvido automaticamente (git rerere status/diff mostram isso)"""
"rerere-1.prompt" = "Ative o rerere, depois faça merge do feature (dá conflito), resolva o greeting.txt como quiser e faça o commit. O git vai gravar sua resolução."
"rerere-1.hint1" = "Ative ANTES do merge: git config rerere.enabled true"
"rerere-1.hint2" = "Depois resolva o conflito como na lição de merge."
