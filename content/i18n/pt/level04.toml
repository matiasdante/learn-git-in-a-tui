"reset.title" = "Voltando atrás: reset"
"reset.theory" = """
Você fez commit cedo demais. `git reset` move o branch atual para outro commit, e o modo decide o que acontece com as suas mudanças:

  git reset --soft HEAD~1    o branch volta um commit; as mudanças ficam PREPARADAS
  git reset HEAD~1           (mixed, o padrão) as mudanças ficam nos arquivos, mas SEM PREPARAR
  git reset --hard HEAD~1    o branch volta e as mudanças são DESCARTADAS

Só use reset em commits que você não publicou: ele reescreve o histórico. O --hard destrói trabalho (embora o git reflog muitas vezes o resgate)."""
"reset-1.prompt" = "O último commit (Add c) foi prematuro. Desfaça-o, mas mantenha as mudanças preparadas, prontas para commitar de novo."
"reset-1.hint1" = "Escolha o modo de reset que mantém o índice."
"reset-1.hint2" = "Digite: git reset --soft HEAD~1"
"reset-1.check1.fail" = "O último commit ainda está lá."
"reset-1.check2.fail" = "O c.txt deveria ficar preparado depois do reset."
"reset-2.prompt" = "Desfaça o último commit e tire as mudanças da preparação, mas mantenha o arquivo c.txt no disco."
"reset-2.hint1" = "O modo padrão do reset é o que você precisa."
"reset-2.check1.fail" = "O último commit ainda está lá."
"reset-2.check2.fail" = "O c.txt deveria existir, mas sem rastreamento."
"reset-3.prompt" = "Jogue fora o último commit e tudo o que ele mudou."
"reset-3.hint1" = "Este é o modo destrutivo."
"reset-3.check1.fail" = "O último commit ainda está lá."
"reset-3.check2.fail" = "O c.txt ainda está na pasta. O --hard o remove."
"revert.title" = "Desfazer com segurança: revert"
"revert.theory" = """
Um commit que quebrou a produção já foi publicado e seus colegas o têm. Você não pode reescrever o histórico compartilhado. `git revert` cria um commit NOVO que faz o oposto de um commit antigo, então o histórico só cresce.

  git revert HEAD              desfaz o último commit
  git revert <commit>          desfaz qualquer commit, mesmo um antigo
  git revert --no-edit HEAD    pula o editor de mensagem"""
"revert-1.prompt" = "O último commit quebrou a produção e já foi publicado. Desfaça-o sem reescrever o histórico."
"revert-1.hint1" = "Não use reset em histórico compartilhado. Use o comando que adiciona um commit novo."
"revert-1.hint2" = "Digite: git revert HEAD  (salve a mensagem com Ctrl+S)"
"revert-1.check1.fail" = "O histórico deveria ter 4 commits: os 3 antigos mais o revert."
"revert-1.check2.fail" = "O c.txt ainda está lá: a mudança não foi revertida."
"revert-1.check3.fail" = "O último commit deveria ser um commit de revert."
"revert-2.prompt" = "O commit \"Add b\" (o segundo de cima para baixo) foi um erro. Reverta só esse commit, sem mexer no a.txt nem no c.txt."
"revert-2.hint1" = "O revert aceita qualquer commit, por exemplo HEAD~1."
"revert-2.hint2" = "Digite: git revert HEAD~1"
"revert-2.check1.fail" = "O histórico deveria ter 4 commits: os 3 antigos mais o revert."
"revert-2.check2.fail" = "O b.txt ainda está lá."
"revert-2.check3.fail" = "O a.txt deve permanecer."
"revert-2.check4.fail" = "O c.txt deve permanecer."
"amend.title" = "Corrigindo o último commit: amend"
"amend.theory" = """
Um erro de digitação na mensagem, ou um arquivo que você esqueceu de adicionar. Em vez de empilhar um commit de "correção", substitua o último:

  git commit --amend -m "Nova mensagem"   muda a mensagem
  git commit --amend --no-edit            mantém a mensagem e inclui o que estiver preparado

O amend cria um commit novo com outro hash, então só corrija commits que você não publicou."""
"amend-1.prompt" = "A mensagem do último commit tem um erro de digitação (\"logn\"). Mude-a para \"Add login page\" sem criar outro commit."
"amend-1.hint1" = "O commit tem uma opção --amend."
"amend-1.hint2" = "Digite: git commit --amend -m \"Add login page\""
"amend-1.check1.fail" = "A mensagem ainda não é \"Add login page\"."
"amend-1.check2.fail" = "Ainda deveria haver um commit: o amend o substitui."
"amend-2.prompt" = "Você esqueceu de incluir o b.txt (já preparado) no último commit. Adicione-o a esse commit, mantendo a mensagem."
"amend-2.hint1" = "--no-edit mantém a mensagem."
"amend-2.check1.fail" = "O b.txt ainda não faz parte do último commit."
"amend-2.check2.fail" = "Ainda deveria haver um commit."
"rebase.title" = "Reescrevendo o histórico: rebase"
"rebase.theory" = """
`git rebase` reaplica seus commits sobre outra base. Dois usos clássicos:

1) Manter um branch de funcionalidade atualizado sem commits de merge:
  git switch feature
  git rebase main            seus commits são reaplicados depois do main mais recente

2) Limpar antes de compartilhar, com o modo interativo:
  git rebase -i HEAD~3       abre uma lista dos últimos 3 commits
  pick   manter    squash   juntar ao anterior    drop   apagar    reword   mudar a mensagem

Edite a lista no editor, salve com Ctrl+S e o git faz o resto. Nunca faça rebase de commits que outras pessoas já têm."""
"rebase-1.prompt" = "Você está no feature e o main avançou. Reaplique seu commit sobre o main mais recente, mantendo o histórico linear."
"rebase-1.hint1" = "Execute o rebase a partir do feature, indicando o branch sobre o qual fazer o rebase."
"rebase-1.hint2" = "Digite: git rebase main"
"rebase-1.check1.fail" = "Você deveria continuar no feature."
"rebase-1.check2.fail" = "O feature ainda não está baseado no main mais recente."
"rebase-1.check3.fail" = "O histórico deveria ser linear com 3 commits: a base, o trabalho do main e a sua funcionalidade."
"rebase-1.check4.fail" = "Há um commit de merge; o rebase deveria evitá-lo."
"rebase-2.prompt" = "Os três últimos commits (WIP part 1, WIP part 2, Finish feature) são ruído. Una-os em um único commit com um rebase interativo."
"rebase-2.hint1" = "git rebase -i HEAD~3 mostra os três últimos commits."
"rebase-2.hint2" = "Mantenha o primeiro como pick e mude os outros dois de pick para squash. Salve com Ctrl+S; um segundo editor pede a mensagem final."
"rebase-2.check1.fail" = "O histórico deveria ter 2 commits: a base e o commit unido."
"rebase-2.check2.fail" = "O commit unido perdeu suas mudanças (d.txt)."
"rebase-3.prompt" = "O commit \"Add debug logging\" nunca deveria chegar à equipe. Tire-o do histórico com um rebase interativo, mantendo \"Add b\"."
"rebase-3.hint1" = "Na lista, troque pick por drop na linha desse commit."
"rebase-3.hint2" = "Comece com: git rebase -i HEAD~2"
"rebase-3.check1.fail" = "O debug.txt ainda está no projeto: o commit não foi removido."
