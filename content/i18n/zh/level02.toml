"stash.title" = "把工作放进抽屉：stash"
"stash.theory" = """
你改到一半时，突然来了个紧急 bug。做到一半的工作不能提交，工作区不干净时也不能切换分支。`git stash` 会把你尚未提交的改动收进“抽屉”，让文件夹恢复干净。

  git stash             保存已跟踪文件的改动并清理工作区
  git stash -u          连未跟踪的文件也一起保存
  git stash list        查看抽屉里有什么
  git stash pop         取回最近一次贮藏并从列表中移除
  git stash apply       取回，但保留在列表中"""
