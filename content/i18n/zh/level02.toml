"switch.title" = "在分支之间切换：switch"
"switch.theory" = """
你在另一个分支上工作时，同事报告 `develop` 上有个 bug。`git switch` 会把你的工作文件夹切换到另一个分支，并把文件替换成那个分支的版本。

  git switch develop        切换到已有的分支
  git switch -c hotfix      创建分支并切换过去
  git switch -              回到上一个分支

你现在做的提交属于当前所在的分支，因此其他分支不会受影响。"""
"switch-1.prompt" = "切换到 develop 分支。"
"switch-1.hint1" = "输入：git switch develop"
"switch-1.check1.fail" = "你还没有在 develop 上。"
"switch-2.prompt" = "用一条命令创建 hotfix 分支并切换过去。"
"switch-2.hint1" = "switch 的 -c 选项表示创建。"
"switch-2.hint2" = "输入：git switch -c hotfix"
"switch-2.check1.fail" = "你还没有在 hotfix 上。"
"switch-3.prompt" = "在不动 main 的前提下开发一个功能：创建 login 分支，切换过去，并在那里提交一个新文件 login.txt。"
"switch-3.hint1" = "先创建分支，然后在该分支上创建并提交文件。"
"switch-3.hint2" = "git switch -c login，然后 echo login > login.txt，再 git add 和 git commit。"
