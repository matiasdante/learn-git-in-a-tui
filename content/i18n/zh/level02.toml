"mergetool-1.check3.fail" = "缺少 feature 的那一行。"
"tag.title" = "标记版本：tag"
"tag.theory" = """
分支会随着每次提交而移动；标签则固定不动。标签给某个提交一个永久的名字，通常用来标记发布版本，比如 v1.0。

  git tag v0.9                    轻量标签：只是当前提交的一个名字
  git tag -a v1.0 -m "Release"    附注标签：还会保存作者、日期和说明（发布版本请用这种）
  git tag v0.8 HEAD~2             给更早的提交打标签
  git tag -d v0.8                 删除标签
  git tag                         列出所有标签"""
"tag-1.prompt" = "发布时间到了：给当前提交打一个附注标签 v1.0，说明为 \"First release\"。"
"tag-1.hint1" = "-a 让标签成为附注标签，-m 给出它的说明。"
