"checkout.title" = "checkout：老牌瑞士军刀"
"checkout.theory" = """
在 git 2.23 之前，`git checkout` 什么都管：切换分支、恢复文件、查看旧提交。它现在仍然可用，你会在老教程和脚本里见到它。

  git checkout main                   等同于 git switch main
  git checkout main -- config.txt     把 main 上的某一个文件取到你的工作目录（并暂存）
  git checkout HEAD~1                 分离 HEAD：查看更早的提交

处于分离 HEAD 状态时，你不在任何分支上。可以查看和实验，但新提交很容易丢：想保留的话，先创建分支（git switch -c 名字）。"""
"checkout-1.prompt" = "你在 old 分支上，那里的 config.txt 是 v1。在不离开 old 的情况下，取回 main 上的 config.txt（v2）。"
"checkout-1.hint1" = "checkout 接受“分支名 + -- + 文件名”。"
"checkout-1.hint2" = "输入：git checkout main -- config.txt"
"checkout-1.check1.fail" = "你应该继续留在 old 分支上。"
"checkout-1.check2.fail" = "config.txt 仍然是 v1。"
"checkout-1.check3.fail" = "这次改动应该已经暂存（带文件的 checkout 会自动暂存）。"
"checkout-2.prompt" = "查看项目在最新提交的前一个提交时的样子，不要使用分支（分离 HEAD）。"
"checkout-2.hint1" = "HEAD~1 表示当前提交的父提交。"
"checkout-2.hint2" = "输入：git checkout HEAD~1  （git switch --detach HEAD~1 也可以）"
"checkout-2.check1.fail" = "HEAD 仍然指向某个分支。它应该是分离状态。"
"checkout-2.check2.fail" = "HEAD 已分离，但不在最新提交的前一个提交上。"
"merge-ff.title" = "合并：快进（fast-forward）"
"merge-ff.theory" = """
你的功能分支已经完成，期间也没有人动过 main。`git merge` 会把工作带入你当前所在的分支。如果 main 没有移动，git 只是把 main 的指针向前滑动：这就是快进（fast-forward），不会创建新提交。

  git switch main
  git merge feature            可能时直接快进
  git merge --no-ff feature    始终创建合并提交，这样功能分支的历史清晰可见"""
"merge-ff-1.prompt" = "你在 main 上。把 feature 分支的工作合并进 main。"
"merge-ff-1.hint1" = "合并的方向是进入你当前所在的分支。"
"merge-ff-1.hint2" = "输入：git merge feature"
"merge-ff-1.check1.fail" = "你应该在 main 上。"
"merge-ff-1.check2.fail" = "main 还没有包含 feature 的工作。"
"merge-ff-1.check3.fail" = "快进不应该产生额外的提交。"
"merge-ff-2.prompt" = "把 feature 合并进 main，即使可以快进，也要强制生成一个合并提交。"
"merge-ff-2.hint1" = "有一个表示“不要快进”的选项。"
"merge-ff-2.hint2" = "输入：git merge --no-ff feature  （会打开编辑器写提交信息：按 Ctrl+S 保存）"
"merge-ff-2.check1.fail" = "没有合并提交。请使用 --no-ff 选项。"
"merge-ff-2.check2.fail" = "缺少 feature 的工作。"
"merge-3way.title" = "合并：三方合并"
"merge-3way.theory" = """
你在 feature 上工作时，别人往 main 里加了提交。两个分支分叉了，git 不能只是滑动指针。它会把两个末端和它们的共同祖先做比较（三方合并），并创建一个有两个父提交的新合并提交。

  git switch main
  git merge feature        创建合并提交（会打开编辑器写信息）
  git merge feature -m "Merge feature"   直接给出信息

如果两边改的是不同的地方，git 会自动把它们合并在一起。"""
"merge-3way-1.prompt" = "main 和 feature 分叉了。把 feature 合并进 main。"
"merge-3way-1.hint1" = "和之前是同一条命令。git 会替你创建合并提交。"
"merge-3way-1.hint2" = "输入：git merge feature  （在编辑器中按 Ctrl+S 保存信息）"
"merge-3way-1.check1.fail" = "合并提交还不存在。"
"merge-3way-1.check2.fail" = "合并后缺少 feature.txt。"
"merge-3way-1.check3.fail" = "合并后缺少 main.txt。"
"merge-conflict.title" = "合并冲突"
"merge-conflict.theory" = """
两个分支修改了同一个文件的同一行。git 无法判断哪个版本才对，于是停下来，并在文件里做标记：

  <<<<<<< HEAD
  Hello from main
  =======
  Hello from feature
  >>>>>>> feature

`<<<<<<<` 和 `=======` 之间是你这一边的内容，其余是另一个分支的内容。解决步骤：

  1. 编辑文件，写成最终想要的内容（并删掉三行标记）
  2. git add <文件>
  3. git commit        （或 git merge --continue）

如果觉得害怕，`git merge --abort` 会让一切回到合并之前的样子。"""
"merge-conflict-1.prompt" = "把 feature 合并进 main。合并会在 greeting.txt 上冲突：保留两行（先放 main 的那行）来解决冲突，并用一次提交完成合并。"
"merge-conflict-1.hint1" = "git merge feature 会因冲突而停下。用这个命令打开文件：edit greeting.txt"
"merge-conflict-1.hint2" = "只保留那两行，不要留下 <<<<<<<、======= 或 >>>>>>> 标记。按 Ctrl+S 保存。"
"merge-conflict-1.hint3" = "然后：git add greeting.txt，再 git commit -m \"Merge feature\""
"merge-conflict-1.check1.fail" = "合并还没有完成：还没有合并提交。"
"merge-conflict-1.check2.fail" = "greeting.txt 里仍有冲突标记。"
"merge-conflict-1.check3.fail" = "缺少 main 的那一行。"
"merge-conflict-1.check4.fail" = "缺少 feature 的那一行。"
"merge-conflict-2.prompt" = "尝试合并 feature（会冲突），然后改变主意：中止合并，让 main 恢复成原来的样子。"
"merge-conflict-2.hint1" = "先运行 git merge feature。中止的选项属于同一条命令。"
"merge-conflict-2.hint2" = "输入：git merge --abort"
"merge-conflict-2.check1.fail" = "请先用 git merge feature 尝试合并。"
"merge-conflict-2.check2.fail" = "合并仍在进行中。请中止它。"
