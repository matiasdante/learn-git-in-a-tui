"describe.title" = "给提交起名：describe"
"describe.theory" = """
构建需要一个版本号字符串，但提交只有哈希值。`git describe` 会找到当前提交往前最近的标签，并生成一个可读的名字：

  v1.0-2-g3f9a1c2

意思是：在 v1.0 之后又有 2 个提交，当前提交是 3f9a1c2（g 代表 git）。如果正好在标签上，就只得到 v1.0。适合用在构建号和“关于”页面。默认只考虑附注标签（加 --tags 可同时使用轻量标签）。"""
