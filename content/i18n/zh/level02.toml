"mergetool.title" = "用 mergetool 解决冲突"
"mergetool.theory" = """
`git mergetool` 会逐个处理有冲突的文件，并用你配置的工具打开它们，所以你不必自己去找这些文件。真实项目通常用图形化工具；这里则是内置编辑器打开冲突文件。

  git mergetool         依次打开每个有冲突的文件
  git commit            全部解决后完成合并

当你保存并关闭工具时，git 会把该文件标记为已解决（它会替你执行 git add）。"""
"mergetool-1.prompt" = "与 feature 的合并正在进行，greeting.txt 有冲突。运行 git mergetool，在编辑器里保留两行（按 Ctrl+S 保存），然后提交。"
