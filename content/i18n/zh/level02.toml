"branch.title" = "分支：创建、重命名、删除"
"branch.theory" = """
你要试一个有风险的重构，又不能弄坏团队正在用的代码。分支是指向某个提交的可移动指针：创建分支瞬间完成、代价极小，所以你可以放心实验，不满意就丢掉。

  git branch                列出本地分支（* 标记当前分支）
  git branch refactor       在当前提交上创建一个分支（你仍留在原处）
  git branch -m old new     重命名分支
  git branch -d name        删除已经合并的分支
  git branch -D name        即使未合并也强制删除（小心）"""
"branch-1.prompt" = "创建一个名为 refactor 的分支。你必须留在 main 上。"
"branch-1.hint1" = "git branch 加上名字会创建分支，但不会切换过去。"
"branch-1.check1.fail" = "分支 refactor 还不存在。"
"branch-1.check2.fail" = "你应该仍然在 main 上。"
"branch-2.prompt" = "分支 old-experiment 已经合并，不再需要了。把它删除。"
"branch-2.hint1" = "对 git branch 使用删除选项。"
"branch-2.hint2" = "输入：git branch -d old-experiment"
"branch-2.check1.fail" = "old-experiment 仍然存在。"
"branch-2.check2.fail" = "不能删除 main。"
