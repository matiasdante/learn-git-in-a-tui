id = "merge-3way"
level = 2
order = 5

[[exercise]]
id = "merge-3way-1"
hints = 2
solution = ["git merge feature -m \"Merge feature\""]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "base.txt", content = "base\n" },
  { do = "git", args = "add base.txt" },
  { do = "git", args = "commit -m \"Add base\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "feature.txt", content = "feature\n" },
  { do = "git", args = "add feature.txt" },
  { do = "git", args = "commit -m \"Add feature\"" },
  { do = "git", args = "switch main" },
  { do = "write", path = "main.txt", content = "main\n" },
  { do = "git", args = "add main.txt" },
  { do = "git", args = "commit -m \"Add main work\"" },
]
checks = [
  { type = "git_ok", args = "rev-parse --verify HEAD^2" },
  { type = "file_exists", path = "feature.txt" },
  { type = "file_exists", path = "main.txt" },
]
