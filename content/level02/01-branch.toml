id = "branch"
level = 2
order = 1

[[exercise]]
id = "branch-1"
hints = 1
solution = ["git branch refactor"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
]
checks = [
  { type = "branch_exists", name = "refactor" },
  { type = "branch", name = "main" },
]

[[exercise]]
id = "branch-2"
hints = 2
solution = ["git branch -d old-experiment"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "git", args = "branch old-experiment" },
]
checks = [
  { type = "git_fails", args = "show-ref --verify --quiet refs/heads/old-experiment" },
  { type = "branch_exists", name = "main" },
]

[[exercise]]
id = "branch-3"
hints = 1
solution = ["git branch -m featur feature"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "git", args = "branch featur" },
]
checks = [
  { type = "branch_exists", name = "feature" },
  { type = "git_fails", args = "show-ref --verify --quiet refs/heads/featur" },
]
