id = "merge-conflict"
level = 2
order = 6

[[exercise]]
id = "merge-conflict-1"
hints = 3
solution = [{ run = "git merge feature", allow_fail = true }, "echo Hello from main > greeting.txt", "echo Hello from feature >> greeting.txt", "git add greeting.txt", "git commit -m \"Merge feature\""]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "greeting.txt", content = "Hello\n" },
  { do = "git", args = "add greeting.txt" },
  { do = "git", args = "commit -m \"Add greeting\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "greeting.txt", content = "Hello from feature\n" },
  { do = "git", args = "commit -am \"Greet from feature\"" },
  { do = "git", args = "switch main" },
  { do = "write", path = "greeting.txt", content = "Hello from main\n" },
  { do = "git", args = "commit -am \"Greet from main\"" },
]
checks = [
  { type = "git_ok", args = "rev-parse --verify HEAD^2" },
  { type = "file_not_contains", path = "greeting.txt", text = "<<<<<<<" },
  { type = "file_contains", path = "greeting.txt", contains = "Hello from main" },
  { type = "file_contains", path = "greeting.txt", contains = "Hello from feature" },
]

[[exercise]]
id = "merge-conflict-2"
hints = 2
solution = [{ run = "git merge feature", allow_fail = true }, "git merge --abort"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "greeting.txt", content = "Hello\n" },
  { do = "git", args = "add greeting.txt" },
  { do = "git", args = "commit -m \"Add greeting\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "greeting.txt", content = "Hello from feature\n" },
  { do = "git", args = "commit -am \"Greet from feature\"" },
  { do = "git", args = "switch main" },
  { do = "write", path = "greeting.txt", content = "Hello from main\n" },
  { do = "git", args = "commit -am \"Greet from main\"" },
]
checks = [
  { type = "ran", any = ["git merge feature"] },
  { type = "git_fails", args = "rev-parse -q --verify MERGE_HEAD" },
  { type = "file_content", path = "greeting.txt", equals = "Hello from main" },
]
