id = "switch"
level = 2
order = 2

[[exercise]]
id = "switch-1"
hints = 1
solution = ["git switch develop"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "git", args = "branch develop" },
]
checks = [
  { type = "branch", name = "develop" },
]

[[exercise]]
id = "switch-2"
hints = 2
solution = ["git switch -c hotfix"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
]
checks = [
  { type = "branch", name = "hotfix" },
]

[[exercise]]
id = "switch-3"
hints = 2
solution = ["git switch -c login", "echo login > login.txt", "git add login.txt", "git commit -m \"Add login\""]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
]
checks = [
  { type = "branch", name = "login" },
  { type = "git_ok", args = "cat-file -e login:login.txt" },
  { type = "git_fails", args = "cat-file -e main:login.txt" },
]
