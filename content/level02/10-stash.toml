id = "stash"
level = 2
order = 10

[[exercise]]
id = "stash-1"
hints = 1
solution = ["git stash"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "f.txt", content = "v1\n" },
  { do = "git", args = "add f.txt" },
  { do = "git", args = "commit -m \"Add f\"" },
  { do = "write", path = "f.txt", content = "v2 half done\n" },
]
checks = [
  { type = "file_content", path = "f.txt", equals = "v1" },
  { type = "git_output", args = "rev-list -g --count refs/stash", equals = "1" },
]

[[exercise]]
id = "stash-2"
hints = 1
solution = ["git stash pop"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "f.txt", content = "v1\n" },
  { do = "git", args = "add f.txt" },
  { do = "git", args = "commit -m \"Add f\"" },
  { do = "write", path = "f.txt", content = "v2 half done\n" },
  { do = "git", args = "stash" },
]
checks = [
  { type = "file_content", path = "f.txt", equals = "v2 half done" },
  { type = "git_fails", args = "rev-parse --verify --quiet refs/stash" },
]

[[exercise]]
id = "stash-3"
hints = 2
solution = ["git stash -u"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "f.txt", content = "v1\n" },
  { do = "git", args = "add f.txt" },
  { do = "git", args = "commit -m \"Add f\"" },
  { do = "write", path = "new.txt", content = "brand new file\n" },
]
checks = [
  { type = "file_missing", path = "new.txt" },
  { type = "git_output", args = "rev-list -g --count refs/stash", equals = "1" },
]
