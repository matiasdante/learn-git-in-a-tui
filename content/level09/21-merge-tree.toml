id = "merge-tree"
level = 9
order = 21
min_git = "2.38"

[[exercise]]
id = "merge-tree-1"
hints = 1
solution = ["git merge-tree --write-tree main feature > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "base.txt", content = "b\n" },
  { do = "git", args = "add base.txt" },
  { do = "git", args = "commit -m \"Base\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "feature.txt", content = "f\n" },
  { do = "git", args = "add feature.txt" },
  { do = "git", args = "commit -m \"Feature\"" },
  { do = "git", args = "switch main" },
  { do = "write", path = "main.txt", content = "m\n" },
  { do = "git", args = "add main.txt" },
  { do = "git", args = "commit -m \"Main\"" },
]
checks = [
  { type = "git_output", args = "ls-tree --name-only {{file:answer.txt}}", equals = "base.txt\nfeature.txt\nmain.txt" },
  { type = "git_output", args = "rev-list --count HEAD", equals = "2" },
]
