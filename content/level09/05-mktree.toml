id = "mktree"
level = 9
order = 5

[[exercise]]
id = "mktree-1"
hints = 2
solution = [{ run = "git mktree > answer.txt", stdin = "100644 blob {{hash-object -w hello.txt}}\thello.txt\n" }]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "hello.txt", content = "hello world\n" },
]
checks = [
  { type = "git_output", args = "ls-tree --name-only {{file:answer.txt}}", equals = "hello.txt" },
]
