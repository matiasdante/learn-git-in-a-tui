id = "ls-tree"
level = 9
order = 3

[title]
en = "Listing a tree: ls-tree"
es = "Listar un tree: ls-tree"

[theory]
en = """
A tree object is a folder: a list of names, modes and hashes. `git ls-tree` prints it.

  git ls-tree HEAD                  mode, type, hash and name of each entry
  git ls-tree --name-only HEAD      just the names
  git ls-tree -r HEAD               recursive, into subfolders"""
es = """
Un objeto tree es una carpeta: una lista de nombres, modos y hashes. `git ls-tree` la imprime.

  git ls-tree HEAD                  modo, tipo, hash y nombre de cada entrada
  git ls-tree --name-only HEAD      solo los nombres
  git ls-tree -r HEAD               recursivo, entrando en las subcarpetas"""

[[exercise]]
id = "ls-tree-1"
solution = ["git ls-tree --name-only HEAD~1 > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "alpha\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "beta\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
  { do = "write", path = "c.txt", content = "gamma\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"Add c\"" },
]
prompt = { en = "Save into answer.txt the names of the files in the tree of HEAD~1.", es = "Guardá en answer.txt los nombres de los archivos del tree de HEAD~1." }
hints = [
  { en = "Use --name-only and name the commit.", es = "Usá --name-only y nombrá el commit." },
]
checks = [
  { type = "file_equals_git", path = "answer.txt", args = "ls-tree --name-only HEAD~1", fail = { en = "answer.txt must contain exactly the output of git ls-tree --name-only HEAD~1.", es = "answer.txt debe contener exactamente la salida de git ls-tree --name-only HEAD~1." } },
]
