id = "symbolic-ref"
level = 9
order = 10

[[exercise]]
id = "symbolic-ref-1"
hints = 1
solution = ["git symbolic-ref HEAD refs/heads/other"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "git", args = "branch other" },
]
checks = [
  { type = "git_output", args = "symbolic-ref HEAD", equals = "refs/heads/other" },
]
