id = "diff-index"
level = 9
order = 17

[[exercise]]
id = "diff-index-1"
hints = 1
solution = ["git diff-index --cached --name-only HEAD > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
  { do = "write", path = "a.txt", content = "a staged\n" },
  { do = "git", args = "add a.txt" },
  { do = "write", path = "b.txt", content = "b unstaged\n" },
]
checks = [
  { type = "file_equals_git", path = "answer.txt", args = "diff-index --cached --name-only HEAD" },
]
