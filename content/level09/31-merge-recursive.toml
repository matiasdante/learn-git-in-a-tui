id = "merge-recursive"
level = 9
order = 31

[title]
en = "Strategy: recursive (and ort)"
es = "Estrategia: recursive (y ort)"

[theory]
en = """
`recursive` was the default strategy for merging two branches: it finds the common ancestor and, when there are several, merges them recursively to build a virtual one. Since git 2.34 the default is the faster rewrite `ort`, with the same results in nearly every case.

  git merge -s recursive feature
  git merge -s ort feature

You rarely choose a strategy by hand; the options -X ours / -X theirs are more common."""
es = """
`recursive` fue la estrategia por defecto para fusionar dos ramas: busca el ancestro común y, cuando hay varios, los fusiona recursivamente para armar uno virtual. Desde git 2.34 la estrategia por defecto es la reescritura más rápida `ort`, con los mismos resultados en casi todos los casos.

  git merge -s recursive feature
  git merge -s ort feature

Casi nunca elegís una estrategia a mano; son más comunes las opciones -X ours / -X theirs."""
