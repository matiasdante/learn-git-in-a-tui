id = "update-ref"
level = 9
order = 9

[[exercise]]
id = "update-ref-1"
hints = 1
solution = ["git update-ref refs/heads/manual HEAD~1"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
]
checks = [
  { type = "git_output", args = "rev-parse refs/heads/manual", same_as = "rev-parse HEAD~1" },
  { type = "ran", any = ["update-ref"] },
]
