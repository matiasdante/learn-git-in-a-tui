id = "commit-tree"
level = 9
order = 8

[[exercise]]
id = "commit-tree-1"
hints = 1
solution = ["git commit-tree {{write-tree}} -m \"Manual commit\" > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
]
checks = [
  { type = "git_output", args = "log -1 --format=%s {{file:answer.txt}}", equals = "Manual commit" },
  { type = "git_fails", args = "rev-parse --verify HEAD" },
]
