[[exercise]]
id = "unpack-file-1"
hints = 1
solution = ["git unpack-file {{rev-parse HEAD:a.txt}} > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "alpha\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
]
checks = [
  { type = "file_contains", path = "answer.txt", contains = ".merge_file_" },
]
