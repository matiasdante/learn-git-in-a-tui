id = "diff-files"
level = 9
order = 16

[[exercise]]
id = "diff-files-1"
hints = 1
solution = ["git diff-files --name-only > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
  { do = "write", path = "a.txt", content = "a changed\n" },
]
checks = [
  { type = "file_equals_git", path = "answer.txt", args = "diff-files --name-only" },
]
