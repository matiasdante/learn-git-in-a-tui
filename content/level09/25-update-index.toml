id = "update-index"
level = 9
order = 25

[[exercise]]
id = "update-index-1"
hints = 1
solution = ["git update-index --add --chmod=+x run.sh"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "write", path = "run.sh", content = "echo hi\n" },
]
checks = [
  { type = "git_output", args = "ls-files --stage run.sh", contains = "100755" },
  { type = "status", path = "a.txt", xy = "??" },
]
