[[exercise]]
id = "checkout-index-1"
hints = 1
solution = ["git checkout-index a.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "alpha\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "rm", path = "a.txt" },
]
checks = [
  { type = "file_content", path = "a.txt", equals = "alpha" },
]
