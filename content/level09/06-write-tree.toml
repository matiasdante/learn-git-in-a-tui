id = "write-tree"
level = 9
order = 6

[[exercise]]
id = "write-tree-1"
hints = 1
solution = ["git write-tree > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add a.txt b.txt" },
]
checks = [
  { type = "git_output", args = "ls-tree --name-only {{file:answer.txt}}", equals = "a.txt\nb.txt" },
]
