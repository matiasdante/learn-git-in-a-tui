id = "prune"
level = 10
order = 2

[[exercise]]
id = "prune-1"
hints = 1
solution = ["git prune --expire=now"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "lost.txt", content = "x\n" },
  { do = "git", args = "add lost.txt" },
  { do = "git", args = "commit -m \"Lost work\"" },
  { do = "git", args = "reset --hard HEAD~1" },
  { do = "git", args = "reflog expire --expire=now --all" },
]
checks = [
  { type = "git_output", args = "fsck --unreachable --no-reflogs", equals = "" },
]
