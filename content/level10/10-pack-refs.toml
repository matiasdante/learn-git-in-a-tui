id = "pack-refs"
level = 10
order = 10

[[exercise]]
id = "pack-refs-1"
hints = 1
solution = ["git pack-refs --all"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "git", args = "branch dev" },
  { do = "git", args = "tag v1" },
]
checks = [
  { type = "file_contains", path = ".git/packed-refs", contains = "refs/heads/dev" },
  { type = "file_missing", path = ".git/refs/heads/dev" },
]
