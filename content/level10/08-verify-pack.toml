id = "verify-pack"
level = 10
order = 8

[title]
en = "Checking a pack: verify-pack"
es = "Revisar un pack: verify-pack"

[theory]
en = """
`git verify-pack` checks that a pack and its index are consistent, and with -v it lists every object with its type, size and how it is stored (delta chains).

  git verify-pack -v .git/objects/pack/pack-<hash>.idx

Use `ls .git/objects/pack` to find the name of the pack."""
es = """
`git verify-pack` comprueba que un pack y su índice sean consistentes y, con -v, lista cada objeto con su tipo, tamaño y cómo está guardado (cadenas de deltas).

  git verify-pack -v .git/objects/pack/pack-<hash>.idx

Usá `ls .git/objects/pack` para encontrar el nombre del pack."""

[[exercise]]
id = "verify-pack-1"
solution = ["git verify-pack -v {{first:.git/objects/pack:.idx}} > report.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "b.txt", content = "b\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Add b\"" },
  { do = "write", path = "c.txt", content = "c\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"Add c\"" },
  { do = "git", args = "repack -a -d -q" },
]
prompt = { en = "The repository has one pack in .git/objects/pack. Verify it in verbose mode and save the report into report.txt.", es = "El repositorio tiene un pack en .git/objects/pack. Verificalo en modo detallado y guardá el reporte en report.txt." }
hints = [
  { en = "ls .git/objects/pack shows the file names. Use the .idx one.", es = "ls .git/objects/pack muestra los nombres. Usá el .idx." },
  { en = "git verify-pack -v <that path> > report.txt", es = "git verify-pack -v <esa ruta> > report.txt" },
]
checks = [
  { type = "file_contains", path = "report.txt", contains = "non delta:", fail = { en = "report.txt does not look like the output of verify-pack -v.", es = "report.txt no parece la salida de verify-pack -v." } },
]
