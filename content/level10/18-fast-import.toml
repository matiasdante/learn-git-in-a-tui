id = "fast-import"
level = 10
order = 18

[[exercise]]
id = "fast-import-1"
hints = 1
solution = ["git fast-import < stream.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "stream.txt", content = "commit refs/heads/main\ncommitter Ann <ann@example.com> 1704110400 +0000\ndata 13\nHello import\nM 100644 inline hello.txt\ndata 6\nworld\n\n" },
]
checks = [
  { type = "git_output", args = "log -1 --format=%s main", equals = "Hello import" },
  { type = "git_output", args = "cat-file -p main:hello.txt", equals = "world" },
]
