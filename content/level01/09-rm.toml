id = "rm"
level = 1
order = 9

[[exercise]]
id = "rm-1"
hints = 1
solution = ["git rm old.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "old.txt", content = "obsolete\n" },
  { do = "write", path = "keep.txt", content = "keep\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add files\"" },
]
checks = [
  { type = "status", path = "old.txt", xy = "D." },
  { type = "file_missing", path = "old.txt" },
]

[[exercise]]
id = "rm-2"
hints = 2
solution = ["git rm --cached secret.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "secret.txt", content = "token=123\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Oops\"" },
]
checks = [
  { type = "status", path = "secret.txt", xy = "D." },
  { type = "file_exists", path = "secret.txt" },
]
