id = "rm"
level = 1
order = 9

[title]
en = "Removing files: rm"
es = "Borrar archivos: rm"

[theory]
en = """
Deleting a file with the normal `rm` leaves git with an unstaged deletion to handle. `git rm` removes the file and stages the deletion in one step.

  git rm old.txt             delete the file and stage the deletion
  git rm --cached secret.txt stop tracking it but keep the file on disk

The second form is the fix when you committed a file by mistake (a local config, a password) and want git to forget it."""
es = """
Borrar un archivo con el `rm` normal le deja a git una eliminación sin preparar. `git rm` borra el archivo y prepara la eliminación en un solo paso.

  git rm viejo.txt             borra el archivo y prepara la eliminación
  git rm --cached secreto.txt  deja de seguirlo pero conserva el archivo en disco

La segunda forma es el arreglo cuando commiteaste un archivo por error (una config local, una contraseña) y querés que git lo olvide."""

[[exercise]]
id = "rm-1"
solution = ["git rm old.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "old.txt", content = "obsolete\n" },
  { do = "write", path = "keep.txt", content = "keep\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add files\"" },
]
prompt = { en = "Remove old.txt from the project and stage that deletion.", es = "Sacá old.txt del proyecto y prepará esa eliminación." }
hints = [
  { en = "There is a git command that deletes and stages at once.", es = "Hay un comando de git que borra y prepara a la vez." },
]
checks = [
  { type = "status", path = "old.txt", xy = "D.", fail = { en = "old.txt deletion is not staged. Use git rm old.txt.", es = "La eliminación de old.txt no está preparada. Usá git rm old.txt." } },
  { type = "file_missing", path = "old.txt", fail = { en = "old.txt still exists on disk.", es = "old.txt todavía existe en disco." } },
]

[[exercise]]
id = "rm-2"
solution = ["git rm --cached secret.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "secret.txt", content = "token=123\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Oops\"" },
]
prompt = { en = "secret.txt was committed by mistake. Make git stop tracking it, but keep the file on disk.", es = "secret.txt se commiteó por error. Hacé que git deje de seguirlo, pero conservá el archivo en disco." }
hints = [
  { en = "Look for an option of git rm that only touches the index.", es = "Buscá una opción de git rm que solo toque el índice." },
  { en = "Type: git rm --cached secret.txt", es = "Escribí: git rm --cached secret.txt" },
]
checks = [
  { type = "status", path = "secret.txt", xy = "D.", fail = { en = "git is still tracking secret.txt.", es = "git todavía sigue a secret.txt." } },
  { type = "file_exists", path = "secret.txt", fail = { en = "The file was deleted from disk. It should remain; the state was restored.", es = "Se borró el archivo del disco. Tenía que quedar; se restauró el estado." } },
]
