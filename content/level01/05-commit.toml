id = "commit"
level = 1
order = 5

[[exercise]]
id = "commit-1"
hints = 2
solution = ["git commit -m \"Add hello\""]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "hello.txt", content = "hello\n" },
  { do = "git", args = "add hello.txt" },
]
checks = [
  { type = "commit_count", count = 1 },
  { type = "status", path = "hello.txt", xy = ".." },
]

[[exercise]]
id = "commit-2"
hints = 2
solution = ["git commit -am \"Update app\""]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "app.txt", content = "v1\n" },
  { do = "git", args = "add app.txt" },
  { do = "git", args = "commit -m \"Add app\"" },
  { do = "write", path = "app.txt", content = "v2\n" },
]
checks = [
  { type = "commit_count", count = 2 },
  { type = "status", path = "app.txt", xy = ".." },
]
