  { do = "git", args = "init" },
  { do = "write", path = "notes.txt", content = "ideas\n" },
]
checks = [
  { type = "status", path = "notes.txt", xy = "A." },
]

[[exercise]]
id = "add-2"
hints = 1
solution = ["git add a.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "ready\n" },
  { do = "write", path = "b.txt", content = "not ready\n" },
]
checks = [
  { type = "status", path = "a.txt", xy = "A." },
  { type = "status", path = "b.txt", xy = "??" },
]
