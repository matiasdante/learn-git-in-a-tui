id = "show"
level = 1
order = 7

[[exercise]]
id = "show-1"
hints = 2
solution = ["git show --name-only", "echo style.css > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "index.html", content = "<h1>Hi</h1>\n" },
  { do = "write", path = "style.css", content = "h1 { color: red; }\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add site\"" },
  { do = "write", path = "style.css", content = "h1 { color: blue; }\n" },
  { do = "git", args = "commit -am \"Change color\"" },
]
checks = [
  { type = "file_content", path = "answer.txt", equals = "style.css" },
]
