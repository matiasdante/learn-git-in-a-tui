id = "mv"
level = 1
order = 10

[[exercise]]
id = "mv-1"
hints = 1
solution = ["git mv draft.txt final.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "draft.txt", content = "my text\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add draft\"" },
]
checks = [
  { type = "status", path = "final.txt", xy = "R." },
  { type = "file_missing", path = "draft.txt" },
]
