id = "restore"
level = 1
order = 11

[[exercise]]
id = "restore-1"
hints = 1
solution = ["git restore config.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "config.txt", content = "v1\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add config\"" },
  { do = "write", path = "config.txt", content = "v2 broken\n" },
]
checks = [
  { type = "file_content", path = "config.txt", equals = "v1" },
  { type = "status", path = "config.txt", xy = ".." },
]

[[exercise]]
id = "restore-2"
hints = 2
solution = ["git restore --staged f.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "f.txt", content = "v1\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add f\"" },
  { do = "write", path = "f.txt", content = "v2\n" },
  { do = "git", args = "add f.txt" },
]
checks = [
  { type = "status", path = "f.txt", xy = ".M" },
  { type = "file_content", path = "f.txt", equals = "v2" },
]
