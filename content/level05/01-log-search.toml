id = "log-search"
level = 5
order = 1

[[exercise]]
id = "log-search-1"
hints = 2
solution = ["git log -S API_KEY --format=%h > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "config.txt", content = "timeout=30\n" },
  { do = "git", args = "add config.txt" },
  { do = "git", args = "commit -m \"Add config\"" },
  { do = "write", path = "config.txt", content = "timeout=30\nAPI_KEY=abc123\n" },
  { do = "git", args = "commit -am \"Tweak config\"" },
  { do = "write", path = "other.txt", content = "x\n" },
  { do = "git", args = "add other.txt" },
  { do = "git", args = "commit -m \"Add other\"" },
  { do = "write", path = "more.txt", content = "y\n" },
  { do = "git", args = "add more.txt" },
  { do = "git", args = "commit -m \"Add more\"" },
]
checks = [
  { type = "file_matches_rev", path = "answer.txt", rev = "HEAD~2" },
]

[[exercise]]
id = "log-search-2"
hints = 2
solution = ["git rev-list --count --author=Bob HEAD > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "1\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "-c user.name=Alice -c user.email=alice@example.com commit -m \"Alice 1\"" },
  { do = "write", path = "b.txt", content = "2\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "-c user.name=Bob -c user.email=bob@example.com commit -m \"Bob 1\"" },
  { do = "write", path = "c.txt", content = "3\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "-c user.name=Alice -c user.email=alice@example.com commit -m \"Alice 2\"" },
  { do = "write", path = "d.txt", content = "4\n" },
  { do = "git", args = "add d.txt" },
  { do = "git", args = "-c user.name=Bob -c user.email=bob@example.com commit -m \"Bob 2\"" },
  { do = "write", path = "e.txt", content = "5\n" },
  { do = "git", args = "add e.txt" },
  { do = "git", args = "-c user.name=Alice -c user.email=alice@example.com commit -m \"Alice 3\"" },
]
checks = [
  { type = "file_content", path = "answer.txt", equals = "2" },
]
