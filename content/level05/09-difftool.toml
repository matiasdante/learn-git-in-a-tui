id = "difftool"
level = 5
order = 9

[[exercise]]
id = "difftool-1"
hints = 1
solution = ["git difftool > diff.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "notes.txt", content = "first\n" },
  { do = "git", args = "add notes.txt" },
  { do = "git", args = "commit -m \"Add notes\"" },
  { do = "write", path = "notes.txt", content = "first\nchanged line\n" },
]
checks = [
  { type = "file_contains", path = "diff.txt", contains = "+changed line" },
]
