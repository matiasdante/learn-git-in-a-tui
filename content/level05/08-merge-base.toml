id = "merge-base"
level = 5
order = 8

[title]
en = "Finding the fork point: merge-base"
es = "Encontrar el punto de bifurcación: merge-base"

[theory]
en = """
Where did `feature` split from `main`? `git merge-base A B` prints the best common ancestor of two commits: the point both histories share. Merge and rebase use it internally.

  git merge-base main feature
  git merge-base --is-ancestor A B    exit code 0 if A is contained in B"""
es = """
¿Dónde se separó `feature` de `main`? `git merge-base A B` imprime el mejor ancestro común de dos commits: el punto que comparten las dos historias. Merge y rebase lo usan internamente.

  git merge-base main feature
  git merge-base --is-ancestor A B    código de salida 0 si A está contenido en B"""

[[exercise]]
id = "merge-base-1"
solution = ["git merge-base main feature > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "1\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"One\"" },
  { do = "write", path = "b.txt", content = "2\n" },
  { do = "git", args = "add b.txt" },
  { do = "git", args = "commit -m \"Two\"" },
  { do = "git", args = "switch -c feature" },
  { do = "write", path = "f.txt", content = "f\n" },
  { do = "git", args = "add f.txt" },
  { do = "git", args = "commit -m \"Feature work\"" },
  { do = "git", args = "switch main" },
  { do = "write", path = "c.txt", content = "3\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"Three\"" },
  { do = "write", path = "d.txt", content = "4\n" },
  { do = "git", args = "add d.txt" },
  { do = "git", args = "commit -m \"Four\"" },
]
prompt = { en = "Write into answer.txt the hash of the commit where feature split from main.", es = "Escribí en answer.txt el hash del commit donde feature se separó de main." }
hints = [
  { en = "git merge-base takes the two branches.", es = "git merge-base recibe las dos ramas." },
]
checks = [
  { type = "file_matches_rev", path = "answer.txt", rev = "feature~1", fail = { en = "answer.txt must contain the hash of the fork point (\"Two\").", es = "answer.txt debe contener el hash del punto de bifurcación (\"Two\")." } },
]
