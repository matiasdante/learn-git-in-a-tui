id = "grep"
level = 5
order = 4

[[exercise]]
id = "grep-1"
hints = 2
solution = ["git grep -h TODO > todos.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "x\n// TODO: refactor\ny\n" },
  { do = "write", path = "b.txt", content = "TODO: add tests\nz\n" },
  { do = "write", path = "notes.txt", content = "nothing here\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add files\"" },
  { do = "write", path = "untracked.txt", content = "TODO: ignored by git grep\n" },
]
checks = [
  { type = "file_equals_git", path = "todos.txt", args = "grep -h TODO" },
]
