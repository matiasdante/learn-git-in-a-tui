id = "blame"
level = 5
order = 3

[[exercise]]
id = "blame-1"
hints = 1
solution = ["git blame -L 2,2 app.txt", "echo Bob > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "app.txt", content = "line one\n" },
  { do = "git", args = "add app.txt" },
  { do = "git", args = "-c user.name=Alice -c user.email=alice@example.com commit -m \"Start app\"" },
  { do = "write", path = "app.txt", content = "line one\nline two\n" },
  { do = "git", args = "-c user.name=Bob -c user.email=bob@example.com commit -am \"Add line two\"" },
  { do = "write", path = "app.txt", content = "line one\nline two\nline three\n" },
  { do = "git", args = "-c user.name=Carol -c user.email=carol@example.com commit -am \"Add line three\"" },
]
checks = [
  { type = "file_content", path = "answer.txt", equals = "Bob" },
]
