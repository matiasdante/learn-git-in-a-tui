id = "credential"
level = 8
order = 7

[title]
en = "Remembering passwords: credential"
es = "Recordar contraseñas: credential"

[theory]
en = """
When git talks to a server that needs a password, it asks a credential helper instead of prompting you every time. `git credential` is the machinery behind it, and you can use it directly:

  git credential fill       ask the helper for a password (you type protocol/host, it answers)
  git credential approve    tell the helper "these credentials worked, save them"
  git credential reject     tell it "they failed, forget them"

Input is key=value lines (protocol, host, username, password) ended with an empty line or Ctrl+D. NEVER type real passwords in this practice; use made-up ones."""
es = """
Cuando git habla con un servidor que pide contraseña, consulta a un asistente de credenciales (credential helper) en vez de preguntarte cada vez. `git credential` es la maquinaria detrás, y la podés usar directamente:

  git credential fill       pide una contraseña al asistente (escribís protocolo/host y responde)
  git credential approve    le dice al asistente "estas credenciales funcionaron, guardalas"
  git credential reject     le dice "fallaron, olvidalas"

La entrada son líneas clave=valor (protocol, host, username, password) terminadas con una línea vacía o Ctrl+D. NUNCA escribas contraseñas reales en esta práctica; usá inventadas."""

[[exercise]]
id = "credential-1"
solution = [{ run = "git credential approve", stdin = "protocol=https\nhost=example.com\nusername=ana\npassword=s3cret\n" }]
setup = [
  { do = "git", args = "config --global credential.helper store" },
]
prompt = { en = "The helper store is configured. Save the credentials ana / s3cret for https://example.com with git credential approve (type the four lines, then press Ctrl+D).", es = "El asistente store está configurado. Guardá las credenciales ana / s3cret para https://example.com con git credential approve (escribí las cuatro líneas y apretá Ctrl+D)." }
hints = [
  { en = "Lines: protocol=https, host=example.com, username=ana, password=s3cret.", es = "Líneas: protocol=https, host=example.com, username=ana, password=s3cret." },
  { en = "After the fourth line press Ctrl+D to close the input.", es = "Después de la cuarta línea apretá Ctrl+D para cerrar la entrada." },
]
checks = [
  { type = "home_file_contains", path = ".git-credentials", contains = "ana:s3cret@example.com", fail = { en = "The credentials were not saved. Did you press Ctrl+D after the last line?", es = "Las credenciales no se guardaron. ¿Apretaste Ctrl+D después de la última línea?" } },
]
