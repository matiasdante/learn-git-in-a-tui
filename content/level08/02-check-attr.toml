id = "check-attr"
level = 8
order = 2

[[exercise]]
id = "check-attr-1"
hints = 1
solution = ["git check-attr eol notes.txt > answer.txt"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = ".gitattributes", content = "*.txt text eol=lf\n*.png binary\n" },
  { do = "write", path = "notes.txt", content = "hi\n" },
]
checks = [
  { type = "file_equals_git", path = "answer.txt", args = "check-attr eol notes.txt" },
]

[[exercise]]
id = "check-attr-2"
hints = 2
solution = ["echo *.png binary > .gitattributes"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "logo.png", content = "not really an image\n" },
]
checks = [
  { type = "git_output", args = "check-attr diff logo.png", equals = "logo.png: diff: unset" },
]
