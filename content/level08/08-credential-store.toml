id = "credential-store"
level = 8
order = 8

[title]
en = "The store helper: credential-store"
es = "El asistente store: credential-store"

[theory]
en = """
`credential-store` is the simplest helper: it saves passwords in clear text in a file (~/.git-credentials). Fine for a throw-away machine, dangerous elsewhere: prefer your operating system's keychain.

  git config --global credential.helper store            use ~/.git-credentials
  git config --global credential.helper "store --file=/safe/place/creds"   another file

Anyone who can read that file can read your passwords."""
es = """
`credential-store` es el asistente más simple: guarda las contraseñas en texto plano en un archivo (~/.git-credentials). Está bien en una máquina descartable, es peligroso en otras: preferí el llavero de tu sistema operativo.

  git config --global credential.helper store            usa ~/.git-credentials
  git config --global credential.helper "store --file=/lugar/seguro/creds"   otro archivo

Cualquiera que pueda leer ese archivo puede leer tus contraseñas."""

[[exercise]]
id = "credential-store-1"
solution = ["git config --global credential.helper store"]
setup = [
  { do = "git", args = "init" },
]
prompt = { en = "Configure git (for your user) to remember passwords with the store helper.", es = "Configurá git (para tu usuario) para recordar contraseñas con el asistente store." }
hints = [
  { en = "The key is credential.helper.", es = "La clave es credential.helper." },
]
checks = [
  { type = "config", key = "credential.helper", value = "store", fail = { en = "credential.helper is not store yet.", es = "credential.helper todavía no es store." } },
]
