id = "hook"
level = 8
order = 4

[[exercise]]
id = "hook-1"
hints = 2
solution = ["echo \"#!/bin/sh\" > .git/hooks/pre-commit", "echo \"echo No commits today\" >> .git/hooks/pre-commit", "echo \"exit 1\" >> .git/hooks/pre-commit", "chmod +x .git/hooks/pre-commit", { run = "git commit -m \"try\"", allow_fail = true }]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
]
checks = [
  { type = "file_contains", path = ".git/hooks/pre-commit", contains = "exit 1" },
  { type = "file_contains", path = ".git/hooks/pre-commit", contains = "#!/bin/sh" },
  { type = "ran", any = ["git commit"] },
  { type = "commit_count", count = 0 },
]
