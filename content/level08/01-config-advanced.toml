id = "config-advanced"
level = 8
order = 1

[[exercise]]
id = "config-adv-1"
hints = 2
solution = ["git config --global alias.st status"]
setup = [
  { do = "git", args = "init" },
]
checks = [
  { type = "config", key = "alias.st", value = "status" },
]

[[exercise]]
id = "config-adv-2"
hints = 1
solution = ["git config --local pull.rebase true"]
setup = [
  { do = "git", args = "init" },
]
checks = [
  { type = "git_output", args = "config --local --get pull.rebase", equals = "true" },
]

[[exercise]]
id = "config-adv-3"
hints = 1
solution = ["git config --global --unset user.signingkey"]
setup = [
  { do = "git", args = "init" },
  { do = "git", args = "config --global user.signingkey ABC123" },
]
checks = [
  { type = "git_fails", args = "config --get user.signingkey" },
]
