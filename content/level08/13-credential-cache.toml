id = "credential-cache"
level = 8
order = 13

[title]
en = "credential-cache (Linux and macOS)"
es = "credential-cache (Linux y macOS)"

[theory]
en = """
`credential-cache` keeps your password in memory for a while (15 minutes by default) and then forgets it: safer than writing it to disk.

  git config --global credential.helper 'cache --timeout=3600'

It talks to a small background program through a Unix socket, so it does NOT exist on Windows (use the Git Credential Manager there). That is why it is explained and not practiced."""
es = """
`credential-cache` guarda tu contraseña en memoria un rato (15 minutos por defecto) y después la olvida: más seguro que escribirla en disco.

  git config --global credential.helper 'cache --timeout=3600'

Se comunica con un programita en segundo plano a través de un socket Unix, así que NO existe en Windows (ahí se usa el Git Credential Manager). Por eso se explica y no se practica."""
