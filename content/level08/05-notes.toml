id = "notes"
level = 8
order = 5

[[exercise]]
id = "notes-1"
hints = 2
solution = ["git notes add -m \"Reviewed by Ana\" HEAD"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
]
checks = [
  { type = "git_output", args = "notes show HEAD", equals = "Reviewed by Ana" },
]
