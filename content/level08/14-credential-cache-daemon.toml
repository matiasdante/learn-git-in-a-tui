id = "credential-cache-daemon"
level = 8
order = 14

[title]
en = "credential-cache--daemon (internal)"
es = "credential-cache--daemon (interno)"

[theory]
en = """
`git credential-cache--daemon` is the background process behind `credential-cache`. The first time the helper needs it, git starts it automatically; it holds the passwords in memory, listens on a socket in ~/.cache/git/credential/ and exits by itself when the timeout expires.

You never start it by hand. To make it forget everything now: git credential-cache exit."""
es = """
`git credential-cache--daemon` es el proceso en segundo plano detrás de `credential-cache`. La primera vez que el asistente lo necesita, git lo inicia solo; guarda las contraseñas en memoria, escucha en un socket en ~/.cache/git/credential/ y termina solo cuando vence el tiempo.

Nunca lo iniciás a mano. Para que olvide todo ahora: git credential-cache exit."""
