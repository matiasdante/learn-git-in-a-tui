id = "replace"
level = 8
order = 6

[[exercise]]
id = "replace-1"
hints = 1
solution = ["git replace HEAD~1 HEAD~2"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "a\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "oops.txt", content = "mistake\n" },
  { do = "git", args = "add oops.txt" },
  { do = "git", args = "commit -m \"Oops, bad commit\"" },
  { do = "write", path = "c.txt", content = "c\n" },
  { do = "git", args = "add c.txt" },
  { do = "git", args = "commit -m \"Add c\"" },
]
checks = [
  { type = "git_output", args = "replace -l", same_as = "--no-replace-objects rev-parse HEAD~1" },
  { type = "git_fails", args = "cat-file -e HEAD~1:oops.txt" },
]
