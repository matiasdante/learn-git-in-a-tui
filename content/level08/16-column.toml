id = "column"
level = 8
order = 16

[title]
en = "column (output layout)"
es = "column (disposición de la salida)"

[theory]
en = """
`git column` arranges lines of text into columns that fit your terminal. Git uses the same engine for several commands, which you can control with the column.* settings:

  git config column.ui auto     branch and tag lists in columns when the output is a terminal
  git branch --column

As a standalone filter it reads standard input: some-command | git column --mode=column. Since this practice has no pipes, it is only explained."""
es = """
`git column` acomoda líneas de texto en columnas que entran en tu terminal. Git usa el mismo motor para varios comandos, que podés controlar con las opciones column.*:

  git config column.ui auto     listas de ramas y tags en columnas cuando la salida es una terminal
  git branch --column

Como filtro independiente lee la entrada estándar: algún-comando | git column --mode=column. Como esta práctica no tiene pipes, solo se explica."""
