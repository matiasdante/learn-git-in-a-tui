id = "submodule"
level = 7
order = 2

[[exercise]]
id = "submodule-1"
cwd = "project"
hints = 2
solution = ["git submodule add ../lib libs/lib"]
setup = [
  { do = "git", args = "init lib" },
  { do = "write", path = "lib/lib.txt", content = "lib v1\n" },
  { do = "git", args = "add lib.txt", dir = "lib" },
  { do = "git", args = "commit -m \"Library v1\"", dir = "lib" },
  { do = "git", args = "init project" },
  { do = "write", path = "project/app.txt", content = "app\n" },
  { do = "git", args = "add app.txt", dir = "project" },
  { do = "git", args = "commit -m \"Add app\"", dir = "project" },
]
checks = [
  { type = "file_exists", path = ".gitmodules" },
  { type = "git_output", args = "ls-files --stage libs/lib", contains = "160000" },
  { type = "file_exists", path = "libs/lib/lib.txt" },
]

[[exercise]]
id = "submodule-2"
cwd = "app"
hints = 2
solution = ["git submodule update --init"]
setup = [
  { do = "git", args = "init lib" },
  { do = "write", path = "lib/lib.txt", content = "lib v1\n" },
  { do = "git", args = "add lib.txt", dir = "lib" },
  { do = "git", args = "commit -m \"Library v1\"", dir = "lib" },
  { do = "git", args = "init project" },
  { do = "write", path = "project/app.txt", content = "app\n" },
  { do = "git", args = "add app.txt", dir = "project" },
  { do = "git", args = "commit -m \"Add app\"", dir = "project" },
  { do = "git", args = "submodule add ../lib libs/lib", dir = "project" },
  { do = "git", args = "commit -m \"Add lib submodule\"", dir = "project" },
  { do = "git", args = "clone project app" },
]
checks = [
  { type = "file_exists", path = "libs/lib/lib.txt" },
]
