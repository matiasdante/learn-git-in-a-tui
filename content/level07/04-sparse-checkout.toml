id = "sparse-checkout"
level = 7
order = 4

[[exercise]]
id = "sparse-1"
hints = 2
solution = ["git sparse-checkout set docs"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "frontend/ui.txt", content = "frontend\n" },
  { do = "write", path = "backend/api.txt", content = "backend\n" },
  { do = "write", path = "docs/readme.txt", content = "docs\n" },
  { do = "git", args = "add ." },
  { do = "git", args = "commit -m \"Add the three folders\"" },
]
checks = [
  { type = "file_exists", path = "docs/readme.txt" },
  { type = "file_missing", path = "frontend/ui.txt" },
  { type = "file_missing", path = "backend/api.txt" },
]
