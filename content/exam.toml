[[question]]
id = "q2-conflict"
level = 2
answer = 3
text = { en = "Two branches changed the same line of a file. What happens when you merge them?", es = "Dos ramas cambiaron la misma línea de un archivo. ¿Qué pasa al fusionarlas?" }
options = [
  { en = "Git silently keeps the newest change", es = "Git se queda en silencio con el cambio más nuevo" },
  { en = "Git deletes one of the branches", es = "Git borra una de las ramas" },
  { en = "Git keeps both lines without asking", es = "Git deja las dos líneas sin preguntar" },
  { en = "Git reports a conflict that you must resolve", es = "Git informa un conflicto que tenés que resolver" },
]

[[question]]
id = "q3-fetch"
level = 3
answer = 2
text = { en = "What does git fetch do?", es = "¿Qué hace git fetch?" }
options = [
  { en = "Uploads your commits to the remote", es = "Sube tus commits al remoto" },
  { en = "Merges the remote branch into your current branch", es = "Fusiona la rama remota en tu rama actual" },
  { en = "Downloads new commits without changing your working branch", es = "Descarga commits nuevos sin cambiar tu rama de trabajo" },
  { en = "Deletes the remote branches", es = "Borra las ramas remotas" },
]

