# Examen de ubicación: 2 preguntas por cada uno de los niveles 1 a 5.

[[question]]
id = "q1-init"
level = 1
answer = 1
text = { en = "Which command turns the current folder into a new git repository?", es = "¿Qué comando convierte la carpeta actual en un repositorio git nuevo?" }
options = [
  { en = "git start", es = "git start" },
  { en = "git init", es = "git init" },
  { en = "git new", es = "git new" },
  { en = "git create", es = "git create" },
]

[[question]]
id = "q1-add"
level = 1
answer = 2
