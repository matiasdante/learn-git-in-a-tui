[[question]]
id = "q4-revert"
level = 4
answer = 0
text = { en = "A bad commit is already pushed to a shared branch. What is the safe way to undo it?", es = "Un commit malo ya está publicado en una rama compartida. ¿Cuál es la forma segura de deshacerlo?" }
options = [
  { en = "git revert <commit>, which adds a new commit that undoes it", es = "git revert <commit>, que agrega un commit nuevo que lo deshace" },
  { en = "git reset --hard and force push", es = "git reset --hard y push forzado" },
  { en = "Delete the repository and clone again", es = "Borrar el repositorio y clonar de nuevo" },
  { en = "git clean -f", es = "git clean -f" },
]

