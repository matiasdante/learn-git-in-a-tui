id = "push"
level = 3
order = 3

[[exercise]]
id = "push-1"
cwd = "project"
hints = 2
solution = ["git push -u origin main"]
setup = [
  { do = "git", args = "init --bare server.git" },
  { do = "git", args = "init project" },
  { do = "write", path = "project/a.txt", content = "one\n" },
  { do = "git", args = "add a.txt", dir = "project" },
  { do = "git", args = "commit -m \"First commit\"", dir = "project" },
  { do = "git", args = "remote add origin ../server.git", dir = "project" },
]
checks = [
  { type = "git_ok", args = "rev-parse --verify main", repo = "server.git" },
  { type = "git_output", args = "rev-parse --abbrev-ref main@{upstream}", equals = "origin/main" },
]

[[exercise]]
id = "push-2"
cwd = "project"
hints = 1
solution = ["git push origin feature"]
setup = [
  { do = "git", args = "init --bare server.git" },
  { do = "git", args = "init seed" },
  { do = "write", path = "seed/a.txt", content = "one\n" },
  { do = "git", args = "add a.txt", dir = "seed" },
  { do = "git", args = "commit -m \"First commit\"", dir = "seed" },
  { do = "write", path = "seed/b.txt", content = "two\n" },
  { do = "git", args = "add b.txt", dir = "seed" },
  { do = "git", args = "commit -m \"Second commit\"", dir = "seed" },
  { do = "git", args = "remote add origin ../server.git", dir = "seed" },
  { do = "git", args = "push -u origin main", dir = "seed" },
  { do = "rm", path = "seed" },
  { do = "git", args = "clone server.git project" },
  { do = "git", args = "switch -c feature", dir = "project" },
  { do = "write", path = "project/f.txt", content = "f\n" },
  { do = "git", args = "add f.txt", dir = "project" },
  { do = "git", args = "commit -m \"Add f\"", dir = "project" },
]
checks = [
  { type = "git_ok", args = "show-ref --verify --quiet refs/heads/feature", repo = "server.git" },
]

[[exercise]]
id = "push-3"
cwd = "project"
hints = 2
solution = ["git push origin --delete old"]
setup = [
  { do = "git", args = "init --bare server.git" },
  { do = "git", args = "init seed" },
  { do = "write", path = "seed/a.txt", content = "one\n" },
  { do = "git", args = "add a.txt", dir = "seed" },
  { do = "git", args = "commit -m \"First commit\"", dir = "seed" },
  { do = "write", path = "seed/b.txt", content = "two\n" },
  { do = "git", args = "add b.txt", dir = "seed" },
  { do = "git", args = "commit -m \"Second commit\"", dir = "seed" },
  { do = "git", args = "remote add origin ../server.git", dir = "seed" },
  { do = "git", args = "push -u origin main", dir = "seed" },
  { do = "rm", path = "seed" },
  { do = "git", args = "clone server.git project" },
  { do = "git", args = "branch old", dir = "project" },
  { do = "git", args = "push origin old", dir = "project" },
]
checks = [
  { type = "git_fails", args = "show-ref --verify --quiet refs/heads/old", repo = "server.git" },
]
