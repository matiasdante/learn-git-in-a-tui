id = "apply"
level = 6
order = 3

[[exercise]]
id = "apply-1"
hints = 1
solution = ["git apply fix.patch"]
setup = [
  { do = "git", args = "init" },
  { do = "write", path = "a.txt", content = "hello\n" },
  { do = "git", args = "add a.txt" },
  { do = "git", args = "commit -m \"Add a\"" },
  { do = "write", path = "fix.patch", content = "diff --git a/a.txt b/a.txt\n--- a/a.txt\n+++ b/a.txt\n@@ -1 +1 @@\n-hello\n+hello world\n" },
]
checks = [
  { type = "file_content", path = "a.txt", equals = "hello world" },
  { type = "commit_count", count = 1 },
  { type = "status", path = "a.txt", xy = ".M" },
]
