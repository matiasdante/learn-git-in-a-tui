id = "request-pull"
level = 6
order = 5

[[exercise]]
id = "request-pull-1"
cwd = "project"
hints = 2
solution = ["git request-pull v1.0 ../server.git main > pr.txt"]
setup = [
  { do = "git", args = "init --bare server.git" },
  { do = "git", args = "init seed" },
  { do = "write", path = "seed/a.txt", content = "one\n" },
  { do = "git", args = "add a.txt", dir = "seed" },
  { do = "git", args = "commit -m \"First commit\"", dir = "seed" },
  { do = "write", path = "seed/b.txt", content = "two\n" },
  { do = "git", args = "add b.txt", dir = "seed" },
  { do = "git", args = "commit -m \"Second commit\"", dir = "seed" },
  { do = "git", args = "remote add origin ../server.git", dir = "seed" },
  { do = "git", args = "push -u origin main", dir = "seed" },
  { do = "rm", path = "seed" },
  { do = "git", args = "clone server.git project" },
  { do = "git", args = "tag v1.0", dir = "project" },
  { do = "write", path = "project/feature.txt", content = "x\n" },
  { do = "git", args = "add feature.txt", dir = "project" },
  { do = "git", args = "commit -m \"New feature\"", dir = "project" },
  { do = "git", args = "push", dir = "project" },
]
checks = [
  { type = "file_contains", path = "pr.txt", contains = "../server.git" },
  { type = "file_contains", path = "pr.txt", contains = "New feature" },
]
